<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vocabulary Notebook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

:root{
  --paper:#F6F3ED;
  --ink:#1E2A45;
  --ink-soft:#5A6478;
  --accent:#E8542E;
  --grid:#DCE2EC;
  --success:#4F8A5B;
  --warn:#C9A227;
  --muted:#9C9686;
  --card:#FFFFFF;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Open Sans',sans-serif;
  color:var(--ink);
  background-color:#FFFFFF; /* 修改为纯白背景 */
  line-height:1.55;
  padding:0 0 60px;
}

.filebar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-family:'Open Sans',sans-serif;
  font-size:12px;
  letter-spacing:0.06em;
  position:sticky;
  top:0;
  z-index:10;
}
.filebar .tag{
  background:var(--accent);
  color:#fff;
  padding:2px 8px;
  border-radius:3px;
  font-weight:600;
}
.filebar .count{font-family:'Open Sans',sans-serif;}
.filebar .due-badge{
  background:var(--warn);
  color:var(--ink);
  padding:2px 8px;
  border-radius:3px;
  font-weight:600;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:32px 20px 0;
}

/* ---- Tabs ---- */
.tabs{
  display:flex;
  gap:4px;
  margin-bottom:22px;
  border-bottom:1px solid var(--grid);
  flex-wrap: wrap;
}
.tab-btn{
  font-family:'Open Sans',sans-serif;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  background:none;
  border:none;
  padding:10px 4px;
  margin-right:18px;
  cursor:pointer;
  color:var(--ink-soft);
  border-bottom:2px solid transparent;
  position:relative;
  top:1px;
}
.tab-btn.active{
  color:var(--ink);
  border-bottom-color:var(--accent);
  font-weight: 600;
}
.tab-btn .badge{
  background:var(--warn);
  color:var(--ink);
  border-radius:3px;
  padding:0 5px;
  font-size:10px;
  margin-left:6px;
}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---- Add form / frames ---- */
.add-frame, .session-frame{
  position:relative;
  background:var(--card);
  border:1px solid var(--ink);
  padding:20px;
  margin-bottom:20px;
  max-width:880px;
}
.corner{position:absolute;width:13px;height:13px;border:2px solid var(--accent);}
.corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none;}
.corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none;}
.corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none;}
.corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none;}

.frame-label{
  font-family:'Open Sans',sans-serif;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:14px;
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}
.form-grid-2{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:12px;
  margin-bottom:12px;
}
.form-row-full{margin-bottom:12px;}

label.field-label{
  display:block;
  font-family:'Open Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:5px;
}

input[type="text"], textarea, select{
  width:100%;
  border:1px solid var(--grid);
  border-radius:4px;
  padding:9px 10px;
  font-family:'Open Sans',sans-serif;
  font-size:14px;
  color:var(--ink);
  background:#fff;
}
input[type="text"]:focus, textarea:focus, select:focus{
  outline:none;
  border-color:var(--accent);
}
textarea{resize:vertical;min-height:54px;}

.sentence-textarea {
  min-height: 80px;
  font-size: 15px;
}

.btn{
  font-family:'Open Sans',sans-serif;
  font-size:12px;
  letter-spacing:0.06em;
  border:1px solid var(--ink);
  border-radius:4px;
  padding:9px 16px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  transition:opacity 0.15s;
}
.btn:hover{opacity:0.85;}
.btn-ghost{
  background:none;
  color:var(--ink-soft);
  border-color:var(--grid);
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{
  background:none;
  color:var(--accent);
  border-color:var(--accent);
}
.btn-danger:hover{background:var(--accent);color:#fff;}
.btn-success{
  background:var(--success);
  border-color:var(--success);
  color:#fff;
}
.btn-warn{
  background:#fff;
  border-color:var(--warn);
  color:var(--warn);
}
.btn-warn:hover{background:var(--warn);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
  align-items:center;
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.toolbar select{width:auto;min-width:110px;}
.empty-msg{
  text-align:center;
  color:var(--muted);
  font-family:'Open Sans',sans-serif;
  font-size:13px;
  padding:40px 0;
  border:1px dashed var(--grid);
  border-radius:6px;
}

/* ---- Entry grid (card layout) ---- */
#words-entries, #sentences-entries{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:12px;
  align-items:stretch;
}
#words-entries .empty-msg, #sentences-entries .empty-msg{
  grid-column:1 / -1;
}
@media (max-width:1080px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(3, 1fr);}
}
@media (max-width:800px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(2, 1fr);}
}
@media (max-width:520px){
  #words-entries, #sentences-entries{grid-template-columns:1fr;}
}

/* ---- Entry cards ---- */
.entry{
  position:relative;
  background:var(--card);
  border:1px solid var(--grid);
  border-left:4px solid var(--accent);
  border-radius:4px;
  padding:14px 16px;
  margin-bottom:0;
  display:flex;
  flex-direction:column;
}
.entry.type-phrase{border-left-color:var(--success);}
.entry.type-sentence{border-left-color:#6C8EBF;}
.entry.editing{grid-column:1 / -1;}

.entry-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:6px;
}
.entry-term{
  font-family:'Open Sans',sans-serif;
  font-weight:600;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height: 1.4;
  flex: 1;
}
.entry-meta{
  display:flex;
  gap:6px;
  align-items:flex-start;
  flex-wrap:wrap;
  flex: 1;
}
.type-badge{
  font-family:'Open Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  border:1px solid var(--grid);
  border-radius:3px;
  padding:2px 6px;
  color:var(--ink-soft);
  margin-top: 2px;
}
.tag-badge{
  font-family:'Open Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.05em;
  background:var(--paper);
  border:1px solid var(--grid);
  border-radius:3px;
  padding:2px 6px;
  color:var(--ink-soft);
  margin-top: 2px;
}
.level-badge{
  font-family:'Open Sans',sans-serif;
  font-size:10px;
  letter-spacing:0.05em;
  border-radius:3px;
  padding:2px 6px;
  color:var(--ink-soft);
  border:1px solid var(--grid);
  margin-top: 2px;
}
.entry-translation{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-bottom:4px;
  white-space:pre-wrap;
}
.entry-note{
  font-size:13px;
  color:var(--ink);
  background:#FBF8F2;
  border-radius:3px;
  padding:8px 10px;
  margin-top:6px;
  white-space:pre-wrap;
}
.entry-date{
  font-family:'Open Sans',sans-serif;
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}
.entry-badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:6px;
}
.entry-footer{
  margin-top:auto;
  padding-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.entry-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ---- Speak button ---- */
.speak-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  flex-shrink:0;
  border:1px solid var(--grid);
  border-radius:50%;
  background:#fff;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  line-height:1;
  padding:0;
  margin-left:2px;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
}
.speak-btn:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.speak-btn:active{transform:scale(0.94);}
.speak-btn.speaking{background:var(--accent);border-color:var(--accent);color:#fff;}
.speak-icon{
  width:14px;
  height:14px;
  object-fit:contain;
  display:block;
  pointer-events:none;
}
.root-word-node .speak-btn .speak-icon{width:11px;height:11px;}
.entry-term-row{display:flex;align-items:flex-start;gap:6px;}
.fc-term-row{display:flex;align-items:center;justify-content:center;gap:8px;}
.quiz-question-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}

/* ============ ROOT NOTES (wireframe tree diagram) ============ */

#roots-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}
.root-card{
  position:relative;
  background:var(--card);
  border:1px solid var(--ink);
  border-radius:4px;
  padding:20px 20px 18px;
}
.root-card-actions{
  position:absolute;
  top:14px;
  right:16px;
  display:flex;
  gap:6px;
}
.root-node-wrap{
  display:flex;
  justify-content:center;
}
.root-node{
  display:flex;
  align-items:baseline;
  gap:10px;
  background:var(--ink);
  color:#fff;
  padding:10px 22px;
  border-radius:6px;
  position:relative;
  z-index:2;
}
.root-node-text{
  font-family:'Open Sans',sans-serif;
  font-weight:800;
  font-size:18px;
  letter-spacing:0.01em;
}
.root-node-meaning{
  font-size:13px;
  opacity:0.85;
}
.root-node .speak-btn{
  border-color:rgba(255,255,255,0.5);
  background:transparent;
  color:#fff;
}
.root-node .speak-btn:hover{background:#fff;color:var(--ink);}
.root-stem-down{
  width:2px;
  height:20px;
  background:var(--grid);
  margin:0 auto;
}
.root-branches-wrap{
  position:relative;
  padding-top:20px;
}
.root-branches-wrap::before{
  content:'';
  position:absolute;
  top:0;
  left:10%;
  right:10%;
  height:2px;
  background:var(--grid);
}
.root-branches{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:16px 14px;
  position:relative;
}
.root-word-branch{
  position:relative;
  padding-top:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.root-word-branch::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  width:2px;
  height:20px;
  background:var(--grid);
  transform:translateX(-50%);
}
.root-word-node{
  position:relative;
  width:150px;
  background:#fff;
  border:1px solid var(--grid);
  border-left:3px solid var(--success);
  border-radius:4px;
  padding:9px 10px 8px;
  text-align:center;
}
.root-word-branch[data-depth="2"] .root-word-node{border-left-color:#6C8EBF;}
.root-word-branch[data-depth="3"] .root-word-node{border-left-color:var(--accent);}
.root-word-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.root-word-text{
  font-family:'Open Sans',sans-serif;
  font-weight:600;
  font-size:14px;
  word-break:break-word;
}
.root-word-meaning{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:3px;
  word-break:break-word;
}

/* 新增的编辑与删除按钮样式 */
.root-word-actions{
  position:absolute;
  top:-8px;
  right:-8px;
  display:flex;
  gap:4px;
  opacity:0;
  transition:opacity 0.15s;
}
.root-word-node:hover .root-word-actions{opacity:1;}
.root-word-action-btn{
  width:18px;
  height:18px;
  border-radius:50%;
  border:1px solid var(--grid);
  background:#fff;
  color:var(--ink-soft);
  font-size:11px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.root-word-action-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

.root-word-add-child{
  margin-top:6px;
  width:100%;
  font-size:10.5px;
  padding:3px 6px;
  border:1px dashed var(--grid);
  background:transparent;
  color:var(--ink-soft);
  border-radius:3px;
  cursor:pointer;
  font-family:'Open Sans',sans-serif;
}
.root-word-add-child:hover{border-color:var(--accent);color:var(--accent);}
.child-add-form{
  display:none;
  flex-direction:column;
  gap:5px;
  width:150px;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--grid);
}
.child-add-form.open{display:flex;}
.child-add-form input{
  font-size:12px;
  padding:5px 7px;
}
.child-add-form .btn{align-self:flex-end;}
.root-empty-hint{
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
  padding:14px 0 4px;
}
.root-add-word-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
  padding-top:14px;
  border-top:1px dashed var(--grid);
}
.root-add-word-row input{
  flex:1;
  min-width:110px;
}

/* ---- Review session ---- */
.session-setup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.session-setup select{width:auto;min-width:160px;}

.flashcard{
  border:1px solid var(--grid);
  border-radius:6px;
  padding:30px 24px;
  text-align:center;
  margin:14px 0;
  min-height:140px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.flashcard .fc-term{
  font-family:'Open Sans',sans-serif;
  font-size:24px;
  font-weight:600;
  white-space:pre-wrap;
  word-break:break-word;
  line-height: 1.3;
}
.flashcard .fc-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.flashcard .fc-back{
  margin-top:10px;
  border-top:1px dashed var(--grid);
  padding-top:14px;
  width:100%;
}
.flashcard .fc-translation{font-size:16px;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
.flashcard .fc-note{
  font-size:13px;
  background:#FBF8F2;
  border-radius:3px;
  padding:8px 10px;
  white-space:pre-wrap;
  text-align:left;
}
.progress-row{
  display:flex;
  justify-content:space-between;
  font-family:'Open Sans',sans-serif;
  font-size:11px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.rate-row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}

/* ---- Quiz ---- */
.quiz-question{
  font-family:'Open Sans',sans-serif;
  font-size:20px;
  font-weight:600;
  text-align:center;
  margin:16px 0;
  white-space:pre-wrap;
  word-break:break-word;
  line-height: 1.3;
}
.quiz-options{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-width:480px;
  margin:0 auto;
}
.quiz-option{
  border:1px solid var(--grid);
  border-radius:4px;
  padding:10px 14px;
  font-size:14px;
  text-align:left;
  background:#fff;
  cursor:pointer;
  transition:border-color 0.15s, background 0.15s;
}
.quiz-option:hover{border-color:var(--accent);}
.quiz-option.correct{border-color:var(--success);background:#F0F7F1;}
.quiz-option.incorrect{border-color:var(--accent);background:#FFF3F0;}
.quiz-option:disabled{cursor:default;}
.quiz-progress{
  font-family:'Open Sans',sans-serif;
  font-size:11px;
  color:var(--ink-soft);
  text-align:center;
  margin-bottom:6px;
}
.quiz-score{
  font-family:'Open Sans',sans-serif;
  font-size:26px;
  text-align:center;
  margin:20px 0 10px;
}
.center{text-align:center;}

@media (max-width:640px){
  .form-grid, .form-grid-2 {grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="filebar">
  <div>Vocabulary_Notebook <span class="tag">TATA World</span></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span class="due-badge" id="due-badge" style="display:none;"></span>
    <span class="count" id="entry-count">0 entries</span>
  </div>
</div>

<div class="wrap">

  <div class="tabs">
    <button class="tab-btn active" data-tab="words" onclick="switchTab('words')">单词与短语 Words</button>
    <button class="tab-btn" data-tab="sentences" onclick="switchTab('sentences')">长句记录 Sentences</button>
    <button class="tab-btn" data-tab="roots" onclick="switchTab('roots')">词根笔记 Roots</button>
    <button class="tab-btn" data-tab="review" onclick="switchTab('review')">每日复习 Review <span class="badge" id="review-tab-badge" style="display:none;"></span></button>
    <button class="tab-btn" data-tab="quiz" onclick="switchTab('quiz')">测验 Quiz</button>
  </div>

  <div class="tab-panel active" id="tab-words">

    <div class="add-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="frame-label">+ 新增单词 / 短语</div>

      <div class="form-grid">
        <div>
          <label class="field-label">单词 / 短语 (English)</label>
          <input type="text" id="word-term" placeholder="e.g. affordance / be passionate about">
        </div>
        <div>
          <label class="field-label">类型</label>
          <select id="word-type">
            <option value="word">单词 Word</option>
            <option value="phrase">短语 Phrase</option>
          </select>
        </div>
        <div>
          <label class="field-label">标签 Tag</label>
          <input type="text" id="word-tag" placeholder="e.g. UX / Interview">
        </div>
      </div>

      <div class="form-row-full">
        <label class="field-label">中文意思 / 翻译</label>
        <input type="text" id="word-translation" placeholder="对应的中文意思">
      </div>

      <div class="form-row-full">
        <label class="field-label">笔记 / 例句</label>
        <textarea id="word-note" placeholder="例句、搭配、容易混淆的点等..."></textarea>
      </div>

      <button class="btn" onclick="addEntry('word')">添加单词记录</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search-words" placeholder="搜索单词/短语..." oninput="render()">
      <select id="filter-type-words" onchange="render()">
        <option value="">全部类型</option>
        <option value="word">单词</option>
        <option value="phrase">短语</option>
      </select>
      <select id="filter-tag-words" onchange="render()">
        <option value="">全部标签</option>
      </select>
      <select id="sort-words" onchange="render()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>

    <div id="words-entries"></div>
  </div>

  <div class="tab-panel" id="tab-sentences">

    <div class="add-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

        <div>
          <label class="field-label">词根 Root</label>

        <div>
          <label class="field-label">词根含义</label>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="root-first-word" placeholder="e.g. inspect" style="flex:1;min-width:140px;">

      <input type="text" id="search-roots" placeholder="搜索词根或派生词..." oninput="renderRoots()">
      <select id="sort-roots" onchange="renderRoots()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>

    <div class="session-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="frame-label">每日复习 — Flashcard Review</div>

      <div id="review-content"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-quiz">
    <div class="session-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="frame-label">测验 — Multiple Choice Quiz</div>

      <div id="quiz-content"></div>
    </div>
  </div>

</div>

<input type="file" id="import-file" accept="application/json" style="display:none;" onchange="importData(event)">

<script>
let entries = [];
let editingId = null;
let roots = [];
let editingRootNodeId = null; // 用于记录当前正在内联编辑的派生词节点ID

const STORAGE_KEY = 'vocab-notebook-entries';
const ROOTS_KEY = 'vocab-notebook-roots';
const DAY = 24*60*60*1000;
const LEVEL_INTERVALS = [1,1,2,4,7,15,30];

/* ============ STORAGE ============ */

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      entries = JSON.parse(raw);
    }
  }catch(e){
    entries = [];
  }
  entries.forEach(e => {
    if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
    if(typeof e.nextReview !== 'number') e.nextReview = Date.now();
    if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
  });
  render();
  renderReview();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Save failed', e);
  }
  updateDueBadge();
}

/* ---- Roots storage ---- */

function loadRoots(){
  try{
    const raw = localStorage.getItem(ROOTS_KEY);
    if(raw) roots = JSON.parse(raw);
  }catch(e){
    roots = [];
  }
  normalizeRoots(roots);
  renderRoots();
}

// 兼容旧数据：确保每个词根有 words 数组，每个派生词节点（不论层级）都有 children 数组
function normalizeRoots(rootList){
  rootList.forEach(r => {
    if(!Array.isArray(r.words)) r.words = [];
    if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
    normalizeWordNodes(r.words);
  });
}
function normalizeWordNodes(nodes){
  nodes.forEach(n => {
    if(!Array.isArray(n.children)) n.children = [];
    normalizeWordNodes(n.children);
  });
}

function saveRoots(){
  try{
    localStorage.setItem(ROOTS_KEY, JSON.stringify(roots));
  }catch(e){
    console.error('Save failed', e);
  }
}

/* ============ TABS ============ */

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if(tab === 'review') renderReview();
  if(tab === 'quiz') renderQuizSetup();
  if(tab === 'roots') renderRoots();
}

function updateDueBadge(){
  const due = entries.filter(e => (e.translation || e.note) && e.nextReview <= Date.now()).length;
  const filebarBadge = document.getElementById('due-badge');
  const tabBadge = document.getElementById('review-tab-badge');
  if(due > 0){
    filebarBadge.style.display = 'inline-block';
    filebarBadge.textContent = `${due} due today`;
    tabBadge.style.display = 'inline-block';
    tabBadge.textContent = due;
  }else{
    filebarBadge.style.display = 'none';
    tabBadge.style.display = 'none';
  }
}

/* ============ ROOT NOTES ============ */

function addRootGroup(){
  const term = document.getElementById('root-term').value.trim();
  const meaning = document.getElementById('root-meaning').value.trim();
  const firstWord = document.getElementById('root-first-word').value.trim();
  const firstMeaning = document.getElementById('root-first-meaning').value.trim();

  if(!term){ document.getElementById('root-term').focus(); return; }

  const words = [];
  if(firstWord){
    words.push({ id: 'rw' + Date.now(), word: firstWord, meaning: firstMeaning, children: [] });
  }

  roots.unshift({
    id: 'r' + Date.now(),
    root: term,
    meaning: meaning,
    words: words,
    createdAt: Date.now()
  });

  document.getElementById('root-term').value = '';
  document.getElementById('root-meaning').value = '';
  document.getElementById('root-first-word').value = '';
  document.getElementById('root-first-meaning').value = '';
  document.getElementById('root-term').focus();

  saveRoots();
  renderRoots();
}

function findWordNode(nodes, nodeId){
  for(const n of nodes){
    if(n.id === nodeId) return n;
    if(n.children && n.children.length){
      const found = findWordNode(n.children, nodeId);
      if(found) return found;
    }
  }
  return null;
}

function removeWordNode(nodes, nodeId){
  const idx = nodes.findIndex(n => n.id === nodeId);
  if(idx !== -1){ nodes.splice(idx, 1); return true; }
  for(const n of nodes){
    if(n.children && n.children.length && removeWordNode(n.children, nodeId)) return true;
  }
  return false;
}

function addWordToRoot(rootId){
  const wordInput = document.getElementById('add-word-' + rootId);
  const meaningInput = document.getElementById('add-word-meaning-' + rootId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }

  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  r.words.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();

  requestAnimationFrame(() => {
    const again = document.getElementById('add-word-' + rootId);
    if(again) again.focus();
  });
}

function toggleChildForm(nodeId){
  const form = document.getElementById('child-form-' + nodeId);
  if(!form) return;
  const isOpen = form.classList.toggle('open');
  if(isOpen){
    const input = document.getElementById('child-word-' + nodeId);
    if(input) input.focus();
  }
}

function addChildWord(rootId, parentNodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const parent = findWordNode(r.words, parentNodeId);
  if(!parent) return;

  const wordInput = document.getElementById('child-word-' + parentNodeId);
  const meaningInput = document.getElementById('child-meaning-' + parentNodeId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }

  if(!Array.isArray(parent.children)) parent.children = [];
  parent.children.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();
}

// 开启派生词的内联编辑
function startEditWordNode(nodeId){
  editingRootNodeId = nodeId;
  renderRoots();
}

// 取消派生词的内联编辑
function cancelEditWordNode(){
  editingRootNodeId = null;
  renderRoots();
}

// 保存派生词的内联编辑修改
function saveEditWordNode(rootId, nodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const node = findWordNode(r.words, nodeId);
  if(!node) return;
  
  const newWord = document.getElementById('edit-node-word-' + nodeId).value.trim();
  const newMeaning = document.getElementById('edit-node-meaning-' + nodeId).value.trim();
  
  if(!newWord){ document.getElementById('edit-node-word-' + nodeId).focus(); return; }
  
  node.word = newWord;
  node.meaning = newMeaning;
  
  editingRootNodeId = null;
  saveRoots();
  renderRoots();
}

function deleteWordNode(rootId, nodeId){
  if(!confirm('确定要删除这个词吗？这也会删除它的所有下级派生词。')) return;
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  removeWordNode(r.words, nodeId);
  saveRoots();
  renderRoots();
}

function deleteRoot(rootId){
  if(!confirm('确定要删除这个词根笔记吗？这会一并删除它下面的所有派生词。')) return;
  roots = roots.filter(r => r.id !== rootId);
  saveRoots();
  renderRoots();
}

function editRootMeta(rootId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const newRoot = prompt('词根：', r.root);
  if(newRoot === null) return;
  const newMeaning = prompt('词根含义：', r.meaning || '');
  if(newMeaning === null) return;
  r.root = newRoot.trim() || r.root;
  r.meaning = newMeaning.trim();
  saveRoots();
  renderRoots();
}

function nodeMatchesSearch(nodes, search){
  return nodes.some(n =>
    n.word.toLowerCase().includes(search) ||
    (n.meaning && n.meaning.toLowerCase().includes(search)) ||
    (n.children && n.children.length && nodeMatchesSearch(n.children, search))
  );
}

function renderRoots(){
  const container = document.getElementById('roots-list');
  if(!container) return;

  const searchEl = document.getElementById('search-roots');
  const sortEl = document.getElementById('sort-roots');
  const search = (searchEl ? searchEl.value : '').trim().toLowerCase();
  const sort = sortEl ? sortEl.value : 'new';

  let list = roots.slice();

  if(search){
    list = list.filter(r =>
      r.root.toLowerCase().includes(search) ||
      (r.meaning && r.meaning.toLowerCase().includes(search)) ||
      nodeMatchesSearch(r.words, search)
    );
  }

  list.sort((a,b) => sort === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  if(list.length === 0){
    container.innerHTML = `<div class="empty-msg">${roots.length === 0 ? '还没有词根笔记 — 在上方创建第一个吧（比如 spect = 看，见）' : '没有找到匹配的词根笔记'}</div>`;
    return;
  }

  container.innerHTML = list.map(renderRootCard).join('');
}

function renderWordTree(nodes, rootId, depth){
  if(!nodes || nodes.length === 0) return '';
  return `
    <div class="root-stem-down"></div>
    <div class="root-branches-wrap">
      <div class="root-branches">
        ${nodes.map(n => renderWordBranch(n, rootId, depth)).join('')}
      </div>
    </div>
  `;
}

function renderWordBranch(node, rootId, depth){
  const children = Array.isArray(node.children) ? node.children : [];
  
  // 判断当前节点是否正处于编辑状态
  if (node.id === editingRootNodeId) {
    return `
      <div class="root-word-branch" data-depth="${depth}">
        <div class="root-word-node" style="padding: 12px 10px;">
          <input type="text" id="edit-node-word-${node.id}" value="${escapeHtml(node.word)}" style="width: 100%; margin-bottom: 6px; font-size: 13px; padding: 5px 8px; text-align: center;">
          <input type="text" id="edit-node-meaning-${node.id}" value="${escapeHtml(node.meaning || '')}" placeholder="意思" style="width: 100%; margin-bottom: 10px; font-size: 12px; padding: 5px 8px; text-align: center;">
          <div style="display: flex; gap: 6px; justify-content: center;">
            <button class="btn btn-success" style="padding: 4px 10px; font-size: 11px;" onclick="saveEditWordNode('${rootId}', '${node.id}')">保存</button>
            <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 11px;" onclick="cancelEditWordNode()">取消</button>
          </div>
        </div>
        ${renderWordTree(children, rootId, depth + 1)}
      </div>
    `;
  }

  // 正常展示状态
  return `
    <div class="root-word-branch" data-depth="${depth}">
      <div class="root-word-node">
        <div class="root-word-actions">
          <button class="root-word-action-btn" onclick="startEditWordNode('${node.id}')" title="编辑单词">✎</button>
          <button class="root-word-action-btn" onclick="deleteWordNode('${rootId}','${node.id}')" title="删除（含所有子节点）">×</button>
        </div>
        <div class="root-word-row">
          <span class="root-word-text">${escapeHtml(node.word)}</span>
          <button class="speak-btn" style="width:20px;height:20px;font-size:11px;" onclick="speakText(this.closest('.root-word-node').querySelector('.root-word-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
        </div>
        ${node.meaning ? `<div class="root-word-meaning">${escapeHtml(node.meaning)}</div>` : ''}
        <button class="root-word-add-child" onclick="toggleChildForm('${node.id}')" title="给这个词再加一个派生词">+ 派生词</button>
      </div>
      <div class="child-add-form" id="child-form-${node.id}">
        <input type="text" id="child-word-${node.id}" placeholder="派生词" onkeydown="if(event.key==='Enter'){document.getElementById('child-meaning-${node.id}').focus();}">
        <input type="text" id="child-meaning-${node.id}" placeholder="意思" onkeydown="if(event.key==='Enter'){addChildWord('${rootId}','${node.id}');}">
        <button class="btn btn-sm" onclick="addChildWord('${rootId}','${node.id}')">添加</button>
      </div>
      ${renderWordTree(children, rootId, depth + 1)}
    </div>
  `;
}

function renderRootCard(r){
  return `
  <div class="root-card">
    <div class="root-card-actions">
      <button class="btn btn-ghost btn-sm" onclick="editRootMeta('${r.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRoot('${r.id}')">删除</button>
    </div>
    <div class="root-node-wrap">
      <div class="root-node">
        <span class="root-node-text">${escapeHtml(r.root)}</span>
        ${r.meaning ? `<span class="root-node-meaning">${escapeHtml(r.meaning)}</span>` : ''}
        <button class="speak-btn" onclick="speakText(this.closest('.root-node').querySelector('.root-node-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
      </div>
    </div>
    ${r.words.length ? renderWordTree(r.words, r.id, 1) : `<div class="root-empty-hint">还没有派生词，在下方添加第一个吧</div>`}
    <div class="root-add-word-row">
      <input type="text" id="add-word-${r.id}" placeholder="派生词，e.g. respect" onkeydown="if(event.key==='Enter'){document.getElementById('add-word-meaning-${r.id}').focus();}">
      <input type="text" id="add-word-meaning-${r.id}" placeholder="意思" onkeydown="if(event.key==='Enter'){addWordToRoot('${r.id}');}">
      <button class="btn btn-sm" onclick="addWordToRoot('${r.id}')">+ 添加</button>
    </div>
  </div>
  `;
}

/* ============ ADD / EDIT / DELETE (Entries) ============ */

function addEntry(mode){
  let term, type, tag, translation, note;

  if (mode === 'word') {
    term = document.getElementById('word-term').value.trim();
    type = document.getElementById('word-type').value;
    tag = document.getElementById('word-tag').value.trim();
    translation = document.getElementById('word-translation').value.trim();
    note = document.getElementById('word-note').value.trim();
    
    if(!term){ document.getElementById('word-term').focus(); return; }
  } else if (mode === 'sentence') {
    term = document.getElementById('sentence-term').value.trim();
    type = 'sentence';
    tag = document.getElementById('sentence-tag').value.trim();
    translation = document.getElementById('sentence-translation').value.trim();
    note = document.getElementById('sentence-note').value.trim();

    if(!term){ document.getElementById('sentence-term').focus(); return; }
  }

  entries.unshift({
    id: 'e' + Date.now(),
    term, type, tag, translation, note,
    createdAt: Date.now(),
    reviewLevel: 0,
    nextReview: Date.now(),
    lastReviewed: 0
  });

  if (mode === 'word') {
    document.getElementById('word-term').value = '';
    document.getElementById('word-tag').value = '';
    document.getElementById('word-translation').value = '';
    document.getElementById('word-note').value = '';
    document.getElementById('word-term').focus();
  } else {
    document.getElementById('sentence-term').value = '';
    document.getElementById('sentence-tag').value = '';
    document.getElementById('sentence-translation').value = '';
    document.getElementById('sentence-note').value = '';
    document.getElementById('sentence-term').focus();
  }

  saveEntries();
  render();
}

function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function startEdit(id){
  editingId = id;
  render();
}

function cancelEdit(){
  editingId = null;
  render();
}

function saveEdit(id){
  const entry = entries.find(e => e.id === id);
  if (entry.type === 'sentence') {
    entry.term = document.getElementById('edit-sen-term-'+id).value.trim();
    entry.tag = document.getElementById('edit-sen-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-sen-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-sen-note-'+id).value.trim();
  } else {
    entry.term = document.getElementById('edit-word-term-'+id).value.trim();
    entry.type = document.getElementById('edit-word-type-'+id).value;
    entry.tag = document.getElementById('edit-word-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-word-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-word-note-'+id).value.trim();
  }
  editingId = null;
  saveEntries();
  render();
}

/* ============ TEXT TO SPEECH ============ */

function speak(text, lang){
  if(!('speechSynthesis' in window)){
    alert('你的浏览器不支持语音朗读功能');
    return;
  }
  if(!text) return;
  speechSynthesis.cancel(); // 停止之前正在读的内容
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || 'en-US';
  utter.rate = 0.92;
  speechSynthesis.speak(utter);
}

// 根据 entry id 朗读该条目的英文内容
function speakEntry(id, btn){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  flashSpeakBtn(btn);
  speak(e.term, 'en-US');
}

// 直接朗读传入文本（用于闪卡/测验等临时场景）
function speakText(text, btn){
  flashSpeakBtn(btn);
  speak(text, 'en-US');
}

function flashSpeakBtn(btn){
  if(!btn) return;
  btn.classList.add('speaking');
  setTimeout(() => btn.classList.remove('speaking'), 400);
}

/* ============ HELPERS ============ */

function typeLabel(type){
  if(type === 'word') return '单词';
  if(type === 'phrase') return '短语';
  if(type === 'sentence') return '句子';
  return type;
}

function formatDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============ RENDER LOGIC ============ */

function updateFilters(){
  const wordsTagSelect = document.getElementById('filter-tag-words');
  const senTagSelect = document.getElementById('filter-tag-sentences');
  
  const wordTags = [...new Set(entries.filter(e => e.type !== 'sentence').map(e => e.tag).filter(Boolean))].sort();
  const senTags = [...new Set(entries.filter(e => e.type === 'sentence').map(e => e.tag).filter(Boolean))].sort();

  const currentWT = wordsTagSelect.value;
  wordsTagSelect.innerHTML = '<option value="">全部标签</option>' + wordTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(wordTags.includes(currentWT)) wordsTagSelect.value = currentWT;

  const currentST = senTagSelect.value;
  senTagSelect.innerHTML = '<option value="">全部标签</option>' + senTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(senTags.includes(currentST)) senTagSelect.value = currentST;
}

function generateEntryHTML(e) {

    if (e.type === 'sentence') {
      return `
        <div class="entry editing type-sentence">

function render(){
  updateFilters();
  updateDueBadge();
  document.getElementById('entry-count').textContent = `总共 ${entries.length} 项记录`;

  const searchW = document.getElementById('search-words').value.trim().toLowerCase();
  const typeFilterW = document.getElementById('filter-type-words').value;
  const tagFilterW = document.getElementById('filter-tag-words').value;
  const sortW = document.getElementById('sort-words').value;

  let wordsList = entries.filter(e => e.type !== 'sentence');
  wordsList = wordsList.filter(e => {
    if(typeFilterW && e.type !== typeFilterW) return false;
    if(tagFilterW && e.tag !== tagFilterW) return false;
    if(searchW && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchW)) return false;
    return true;
  });
  wordsList.sort((a,b) => sortW === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);
  
  const wordsContainer = document.getElementById('words-entries');
  if(entries.filter(e => e.type !== 'sentence').length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">还没有单词记录 — 在上方添加你的第一个单词或短语吧</div>';
  } else if(wordsList.length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">没有符合条件的单词记录</div>';
  } else {
    wordsContainer.innerHTML = wordsList.map(generateEntryHTML).join('');
  }

  const searchS = document.getElementById('search-sentences').value.trim().toLowerCase();
  const tagFilterS = document.getElementById('filter-tag-sentences').value;
  const sortS = document.getElementById('sort-sentences').value;

  let senList = entries.filter(e => e.type === 'sentence');
  senList = senList.filter(e => {
    if(tagFilterS && e.tag !== tagFilterS) return false;
    if(searchS && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchS)) return false;
    return true;
  });
  senList.sort((a,b) => sortS === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  const senContainer = document.getElementById('sentences-entries');
  if(entries.filter(e => e.type === 'sentence').length === 0){
    senContainer.innerHTML = '<div class="empty-msg">还没有长句记录 — 在上方记录你在阅读中遇到的好句子吧</div>';
  } else if(senList.length === 0){
    senContainer.innerHTML = '<div class="empty-msg">没有符合条件的长句记录</div>';
  } else {
    senContainer.innerHTML = senList.map(generateEntryHTML).join('');
  }
}

/* ============ REVIEW (Flashcards) ============ */

let reviewQueue = [];
let reviewIndex = 0;
let reviewRevealed = false;
let reviewStats = {known:0, vague:0, forgot:0};

function reviewableEntries(mode = 'all'){
  return entries.filter(e => {
    if(!(e.translation || e.note)) return false;
    if(mode === 'words' && e.type === 'sentence') return false;
    if(mode === 'sentences' && e.type !== 'sentence') return false;
    return true;
  });
}

function dueEntries(mode = 'all'){
  const now = Date.now();
  return reviewableEntries(mode).filter(e => e.nextReview <= now);
}

function renderReview(){
  const content = document.getElementById('review-content');

  if(reviewQueue.length === 0){
    const dueWords = dueEntries('words').length;
    const allWords = reviewableEntries('words').length;
    const dueSens = dueEntries('sentences').length;
    const allSens = reviewableEntries('sentences').length;

    if(allWords === 0 && allSens === 0){
      content.innerHTML = '<div class="empty-msg">还没有可复习的内容 — 先去添加一些带翻译或笔记的词汇/长句吧</div>';
      return;
    }

    content.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div style="border:1px solid var(--grid); border-left:4px solid var(--success); border-radius:4px; padding:16px; background:var(--card);">
          <div style="font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; margin-bottom:8px;">📝 单词与短语</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">今日待复习：<b>${dueWords}</b> 项（总库共 ${allWords} 项）</div>
          <div class="btn-row">
            <button class="btn" onclick="startReview('words', false)" ${dueWords===0?'disabled':''}>开始今日复习</button>
            <button class="btn btn-ghost" onclick="startReview('words', true)" ${allWords===0?'disabled':''}>复习全部</button>
          </div>
        </div>
        
        <div style="border:1px solid var(--grid); border-left:4px solid #6C8EBF; border-radius:4px; padding:16px; background:var(--card);">
          <div style="font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; margin-bottom:8px;">📖 长句</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">今日待复习：<b>${dueSens}</b> 项（总库共 ${allSens} 项）</div>
          <div class="btn-row">
            <button class="btn" onclick="startReview('sentences', false)" ${dueSens===0?'disabled':''}>开始今日复习</button>
            <button class="btn btn-ghost" onclick="startReview('sentences', true)" ${allSens===0?'disabled':''}>复习全部</button>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if(reviewIndex >= reviewQueue.length){
    content.innerHTML = `
      <div class="quiz-score">复习完成！</div>
      <div class="center" style="font-family:'Open Sans',sans-serif;font-size:13px;color:var(--ink-soft);">
        记得 ${reviewStats.known} · 模糊 ${reviewStats.vague} · 忘记 ${reviewStats.forgot}
      </div>
      <div class="btn-row" style="justify-content:center;margin-top:18px;">
        <button class="btn" onclick="resetReview()">返回列表</button>
      </div>
    `;
    return;
  }

  const e = reviewQueue[reviewIndex];
  content.innerHTML = `
    <div class="progress-row">
      <span>第 ${reviewIndex + 1} / ${reviewQueue.length} 项</span>
      <span>Lv.${e.reviewLevel}</span>
    </div>
    <div class="flashcard">
      <div class="fc-meta">
        <span class="type-badge">${typeLabel(e.type)}</span>
        ${e.tag ? `<span class="tag-badge">${escapeHtml(e.tag)}</span>` : ''}
      </div>
      <div class="fc-term-row">
        <div class="fc-term">${escapeHtml(e.term)}</div>
        <button class="speak-btn" onclick="speakEntry('${e.id}', this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
      </div>
      ${reviewRevealed ? `
        <div class="fc-back">
          ${e.translation ? `<div class="fc-translation">${escapeHtml(e.translation)}</div>` : ''}
          ${e.note ? `<div class="fc-note">${escapeHtml(e.note)}</div>` : ''}
        </div>
      ` : ''}
    </div>
    ${!reviewRevealed ? `
      <div class="center"><button class="btn" onclick="revealCard()">显示答案</button></div>
    ` : `
      <div class="rate-row">
        <button class="btn btn-danger" onclick="rateCard('forgot')">忘记了</button>
        <button class="btn btn-warn" onclick="rateCard('vague')">模糊</button>
        <button class="btn btn-success" onclick="rateCard('known')">记得</button>
      </div>
    `}
  `;
}

function startReview(mode, all){
  reviewQueue = shuffle(all ? reviewableEntries(mode) : dueEntries(mode));
  reviewIndex = 0;
  reviewRevealed = false;
  reviewStats = {known:0, vague:0, forgot:0};
  renderReview();
}
function revealCard(){ reviewRevealed = true; renderReview(); }
function rateCard(rating){
  const e = reviewQueue[reviewIndex];
  const now = Date.now();
  e.lastReviewed = now;
  if(rating === 'known'){ e.reviewLevel = Math.min(e.reviewLevel + 1, LEVEL_INTERVALS.length - 1); reviewStats.known++; }
  else if(rating === 'vague'){ e.reviewLevel = Math.max(e.reviewLevel - 1, 0); reviewStats.vague++; }
  else{ e.reviewLevel = 0; reviewStats.forgot++; }
  e.nextReview = now + LEVEL_INTERVALS[e.reviewLevel] * DAY;
  saveEntries();
  reviewIndex++;
  reviewRevealed = false;
  renderReview();
  render();
}
function resetReview(){ reviewQueue = []; reviewIndex = 0; reviewRevealed = false; renderReview(); }

/* ============ QUIZ ============ */

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function quizEligibleEntries(mode = 'all'){
  return entries.filter(e => {
    if(!(e.translation && e.translation.trim())) return false;
    if(mode === 'words' && e.type === 'sentence') return false;
    if(mode === 'sentences' && e.type !== 'sentence') return false;
    return true;
  });
}

function getQuizOptionsHTML(length) {
  const maxQ = Math.min(length, 20);
  const options = [5,10,20].filter(n => n <= maxQ);
  if(options.length === 0 || options[options.length-1] !== maxQ) options.push(maxQ);
  return options.map(n => `<option value="${n}">${n} 题</option>`).join('');
}

function renderQuizSetup(){
  const content = document.getElementById('quiz-content');
  if(quizQuestions.length > 0 && quizIndex < quizQuestions.length){ renderQuizQuestion(); return; }
  if(quizQuestions.length > 0 && quizIndex >= quizQuestions.length){ renderQuizResult(); return; }

  const eligibleWords = quizEligibleEntries('words');
  const eligibleSens = quizEligibleEntries('sentences');

  if(eligibleWords.length < 2 && eligibleSens.length < 2){
    content.innerHTML = '<div class="empty-msg">每种类型至少需要2条带「中文翻译」的记录才能开始测验，先去补充翻译吧</div>';
    return;
  }

  content.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="border:1px solid var(--grid); border-left:4px solid var(--success); border-radius:4px; padding:16px; background:var(--card); opacity:${eligibleWords.length < 2 ? '0.5' : '1'}">
        <div style="font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; margin-bottom:8px;">📝 单词与短语测验</div>
        <div class="session-setup">
          <span style="font-size:13px; color:var(--ink-soft); margin-right:10px;">可用题目：${eligibleWords.length}</span>
          ${eligibleWords.length >= 2 ? `
            <select id="quiz-count-words">${getQuizOptionsHTML(eligibleWords.length)}</select>
            <select id="quiz-direction-words">
              <option value="en2cn">看英文 → 选中文</option>
              <option value="cn2en">看中文 → 选英文</option>
            </select>
          ` : '<span style="font-size:12px;color:var(--accent);">需至少 2 个带翻译的记录</span>'}
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn" onclick="startQuiz('words')" ${eligibleWords.length < 2 ? 'disabled' : ''}>开始测验</button>
        </div>
      </div>

      <div style="border:1px solid var(--grid); border-left:4px solid #6C8EBF; border-radius:4px; padding:16px; background:var(--card); opacity:${eligibleSens.length < 2 ? '0.5' : '1'}">
        <div style="font-family:'Open Sans',sans-serif; font-size:16px; font-weight:600; margin-bottom:8px;">📖 长句测验</div>
        <div class="session-setup">
          <span style="font-size:13px; color:var(--ink-soft); margin-right:10px;">可用题目：${eligibleSens.length}</span>
          ${eligibleSens.length >= 2 ? `
            <select id="quiz-count-sentences">${getQuizOptionsHTML(eligibleSens.length)}</select>
            <select id="quiz-direction-sentences">
              <option value="en2cn">看英文 → 选中文</option>
              <option value="cn2en">看中文 → 选英文</option>
            </select>
          ` : '<span style="font-size:12px;color:var(--accent);">需至少 2 个带翻译的记录</span>'}
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn" onclick="startQuiz('sentences')" ${eligibleSens.length < 2 ? 'disabled' : ''}>开始测验</button>
        </div>
      </div>
    </div>
  `;
}

function startQuiz(mode){
  const count = parseInt(document.getElementById(`quiz-count-${mode}`).value, 10);
  const direction = document.getElementById(`quiz-direction-${mode}`).value;
  const eligible = quizEligibleEntries(mode);
  const chosen = shuffle(eligible).slice(0, count);
  quizQuestions = chosen.map(e => {
    const correct = direction === 'en2cn' ? e.translation : e.term;
    const pool = eligible.filter(o => o.id !== e.id);
    const distractors = shuffle(pool).slice(0, 3).map(o => direction === 'en2cn' ? o.translation : o.term);
    return { prompt: direction === 'en2cn' ? e.term : e.translation, correct, options: shuffle([correct, ...distractors]), direction };
  });
  quizIndex = 0; quizScore = 0; quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const content = document.getElementById('quiz-content');
  const q = quizQuestions[quizIndex];
  content.innerHTML = `
    <div class="quiz-progress">第 ${quizIndex + 1} / ${quizQuestions.length} 题 · 得分 ${quizScore}</div>
    <div class="quiz-question-row">
      <div class="quiz-question">${escapeHtml(q.prompt)}</div>
      ${q.direction === 'en2cn' ? `<button class="speak-btn" onclick="speakText(this.previousElementSibling.textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>` : ''}
    </div>
    <div class="quiz-options">
      ${q.options.map((opt, i) => `<button class="quiz-option" id="quiz-opt-${i}" onclick="answerQuiz(${i})">${escapeHtml(opt)}</button>`).join('')}
    </div>
  `;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  if(q.options[i] === q.correct) quizScore++;
  q.options.forEach((opt, idx) => {
    const btn = document.getElementById('quiz-opt-' + idx);
    btn.disabled = true;
    if(opt === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('incorrect');
  });
  document.getElementById('quiz-content').innerHTML += `<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn" onclick="nextQuiz()">${quizIndex + 1 < quizQuestions.length ? '下一题' : '查看结果'}</button></div>`;
}

function nextQuiz(){
  quizIndex++; quizAnswered = false;
  if(quizIndex >= quizQuestions.length) renderQuizResult();
  else renderQuizQuestion();
}

function renderQuizResult(){
  document.getElementById('quiz-content').innerHTML = `
    <div class="quiz-score">${quizScore} / ${quizQuestions.length}</div>
    <div class="center" style="font-family:'Open Sans',sans-serif;font-size:13px;color:var(--ink-soft);">正确率 ${Math.round(quizScore/quizQuestions.length*100)}%</div>
    <div class="btn-row" style="justify-content:center;margin-top:18px;"><button class="btn" onclick="restartQuiz()">再来一次</button></div>
  `;
}

function restartQuiz(){ quizQuestions = []; quizIndex = 0; quizScore = 0; quizAnswered = false; renderQuizSetup(); }

/* ============ EXPORT / IMPORT ============ */

function exportData(){
  const payload = { entries: entries, roots: roots, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `vocab-notebook-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);

      // 兼容两种格式：旧版纯数组备份（只有 entries），新版 {entries, roots} 备份
      const importedEntries = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.entries) ? parsed.entries : null);
      const importedRoots = Array.isArray(parsed) ? [] : (Array.isArray(parsed.roots) ? parsed.roots : []);

      if(!importedEntries) throw new Error('Invalid format');

      const totalCount = importedEntries.length + importedRoots.length;
      if(confirm(`导入 ${importedEntries.length} 条单词/句子记录，${importedRoots.length} 条词根笔记。\n点"确定"合并到现有记录，点"取消"替换全部现有记录。`)){
        const existingIds = new Set(entries.map(en => en.id));
        importedEntries.forEach(im => { if(!existingIds.has(im.id)) entries.unshift(im); });

        const existingRootIds = new Set(roots.map(r => r.id));
        importedRoots.forEach(im => { if(!existingRootIds.has(im.id)) roots.unshift(im); });
      }else{
        entries = importedEntries;
        roots = importedRoots;
      }
      entries.forEach(e => {
        if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
        if(typeof e.nextReview !== 'number') e.nextReview = Date.now();
        if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
      });
      roots.forEach(r => {
        if(!Array.isArray(r.words)) r.words = [];
        if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
      });
      normalizeRoots(roots);
      saveEntries(); saveRoots(); render(); renderReview(); renderRoots();
    }catch(err){ alert('导入失败：文件格式不正确'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}
