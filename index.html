<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vocabulary Notebook</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

:root{
  --paper:#F5F5F7;
  --ink:#1D1D1F;
  --ink-soft:#6E6E73;
  --accent:#FF6B4A;
  --accent-blue:#0A84FF;
  --accent-purple:#8B5CF6;
  --grid:#E6E6EA;
  --success:#30B265;
  --warn:#FFB020;
  --danger:#FF453A;
  --muted:#AEAEB4;
  --card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lift:0 10px 30px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --r-pill:999px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Open Sans', 'PingFang SC', 'Helvetica Neue', sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  line-height:1.55;
  padding:0 0 80px;
  -webkit-font-smoothing:antialiased;
}

/* ---- Top bar (frosted glass) ---- */
.filebar{
  background:rgba(29,29,31,0.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  color:rgba(255,255,255,0.92);
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-family:-apple-system, BlinkMacSystemFont, 'Open Sans', sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.filebar .tag{
  background:var(--accent);
  color:#fff;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:600;
  font-size:11px;
  letter-spacing:0.02em;
  margin-left:8px;
}
.filebar .count{font-family:inherit; color:rgba(255,255,255,0.6); font-weight:500;}
.filebar .due-badge{
  background:var(--warn);
  color:#1D1D1F;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:700;
  font-size:11px;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:36px 24px 0;
}

/* ---- Tabs: segmented control ---- */
.tabs{
  display:inline-flex;
  gap:2px;
  margin-bottom:28px;
  border:none;
  background:rgba(120,120,128,0.12);
  padding:4px;
  border-radius:var(--r-pill);
  flex-wrap:wrap;
  justify-content: center;
}
.tab-btn{
  font-family:inherit;
  font-size:13px;
  letter-spacing:0.01em;
  text-transform:none;
  background:none;
  border:none;
  padding:8px 18px;
  margin-right:0;
  cursor:pointer;
  color:var(--ink-soft);
  border-bottom:none;
  border-radius:var(--r-pill);
  position:relative;
  top:0;
  font-weight:500;
  transition:background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.tab-btn.active{
  color:var(--ink);
  background:#fff;
  box-shadow:var(--shadow-sm);
  font-weight:600;
}
.tab-btn .badge{
  background:var(--accent);
  color:#fff;
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-size:10px;
  margin-left:6px;
  font-weight:700;
}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ---- Add form / frames ---- */
.add-frame, .session-frame{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
  padding:26px 28px;
  margin: 0 auto 24px auto; /* 居中显示 */
  max-width:880px;
}
.corner{display:none;}

.frame-label{
  font-family:inherit;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-grid-2{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-row-full{margin-bottom:14px;}

label.field-label{
  display:block;
  font-family:inherit;
  font-size:11px;
  letter-spacing:0.03em;
  text-transform:none;
  color:var(--ink-soft);
  font-weight:600;
  margin-bottom:6px;
}

input[type="text"], textarea, select{
  width:100%;
  border:1px solid var(--grid);
  border-radius:var(--r-sm);
  padding:10px 13px;
  font-family:inherit;
  font-size:14px;
  color:var(--ink);
  background:#FAFAFB;
  transition:border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
input[type="text"]:focus, textarea:focus, select:focus{
  outline:none;
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 4px rgba(255,107,74,0.12);
}
textarea{resize:vertical;min-height:54px;}

.sentence-textarea {
  min-height: 80px;
  font-size: 15px;
}

.btn{
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  border:none;
  border-radius:var(--r-pill);
  padding:10px 20px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  transition:opacity 0.15s ease, transform 0.1s ease;
}
.btn:hover{opacity:0.85;}
.btn:active{transform:scale(0.97);}
.btn-ghost{
  background:rgba(120,120,128,0.12);
  color:var(--ink-soft);
  border:none;
}
.btn-ghost:hover{background:rgba(120,120,128,0.2);color:var(--ink);opacity:1;}
.btn-danger{
  background:rgba(255,69,58,0.1);
  color:var(--danger);
  border:none;
}
.btn-danger:hover{background:var(--danger);color:#fff;opacity:1;}
.btn-success{
  background:var(--success);
  border:none;
  color:#fff;
}
.btn-warn{
  background:rgba(255,176,32,0.14);
  border:none;
  color:#B9781A;
}
.btn-warn:hover{background:var(--warn);color:#fff;opacity:1;}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-icon{padding:6px 10px; font-size:14px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
  align-items:center;
  max-width:880px;
  margin-left:auto;
  margin-right:auto;
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.toolbar select{width:auto;min-width:110px;}
.empty-msg{
  text-align:center;
  color:var(--muted);
  font-family:inherit;
  font-size:13px;
  padding:48px 20px;
  border:1.5px dashed var(--grid);
  border-radius:var(--r-lg);
  background:rgba(120,120,128,0.04);
}

/* ---- Entry grid (card layout) ---- */
#words-entries, #sentences-entries{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
  align-items:stretch;
}
#words-entries .empty-msg, #sentences-entries .empty-msg{
  grid-column:1 / -1;
}
@media (max-width:1080px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(3, 1fr);}
}
@media (max-width:800px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(2, 1fr);}
}
@media (max-width:520px){
  #words-entries, #sentences-entries{grid-template-columns:1fr;}
}

/* ---- Entry cards ---- */
.entry{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-left:none;
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  padding:16px 18px;
  margin-bottom:0;
  display:flex;
  flex-direction:column;
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.entry:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.entry.type-phrase{border-top:3px solid var(--success);}
.entry.type-word{border-top:3px solid var(--accent);}
.entry.type-sentence{border-top:3px solid var(--accent-blue);}
.entry.editing{grid-column:1 / -1;}

.entry-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:6px;
}
.entry-term{
  font-family:inherit;
  font-weight:700;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height: 1.4;
  flex: 1;
}
.entry-meta{
  display:flex;
  gap:6px;
  align-items:flex-start;
  flex-wrap:wrap;
  flex: 1;
}
.type-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.03em;
  text-transform:none;
  border:none;
  background:rgba(120,120,128,0.12);
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--ink-soft);
  margin-top: 2px;
  font-weight:600;
}
.tag-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.02em;
  background:rgba(10,132,255,0.1);
  border:none;
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--accent-blue);
  margin-top: 2px;
  font-weight:600;
}
.level-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.02em;
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--ink-soft);
  border:none;
  background:rgba(120,120,128,0.12);
  margin-top: 2px;
  font-weight:600;
}
.entry-translation{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-bottom:4px;
  white-space:pre-wrap;
}
.entry-note{
  font-size:13px;
  color:var(--ink);
  background:rgba(120,120,128,0.06);
  border-radius:var(--r-sm);
  padding:10px 12px;
  margin-top:8px;
  white-space:pre-wrap;
}
.entry-date{
  font-family:inherit;
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}
.entry-badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:8px;
}
.entry-footer{
  margin-top:auto;
  padding-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.entry-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ---- Speak button ---- */
.speak-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  background:rgba(120,120,128,0.12);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  line-height:1;
  padding:0;
  margin-left:2px;
  transition:background 0.15s, color 0.15s, transform 0.1s;
}
.speak-btn:hover{background:var(--ink);color:#fff;}
.speak-btn:active{transform:scale(0.9);}
.speak-btn.speaking{background:var(--accent);color:#fff;}
.speak-icon{
  width:14px;
  height:14px;
  object-fit:contain;
  display:block;
  pointer-events:none;
}
.root-word-node .speak-btn .speak-icon{width:11px;height:11px;}
.entry-term-row{display:flex;align-items:flex-start;gap:6px;}
.fc-term-row{display:flex;align-items:center;justify-content:center;gap:8px;}
.quiz-question-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}

/* ============ ROOT NOTES (soft rounded tree diagram) ============ */

#roots-list{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.root-card{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
  padding:26px 24px 22px;
}
.root-card-actions{
  position:absolute;
  top:18px;
  right:20px;
  display:flex;
  gap:6px;
}
.root-node-wrap{
  display:flex;
  justify-content:center;
}
.root-node{
  display:flex;
  align-items:baseline;
  gap:10px;
  background:var(--ink);
  color:#fff;
  padding:12px 26px;
  border-radius:var(--r-pill);
  position:relative;
  z-index:2;
  box-shadow:var(--shadow-sm);
}
.root-node-text{
  font-family:inherit;
  font-weight:800;
  font-size:18px;
  letter-spacing:0.01em;
}
.root-node-meaning{
  font-size:13px;
  opacity:0.85;
}
.root-node .speak-btn{
  background:rgba(255,255,255,0.15);
  color:#fff;
}
.root-node .speak-btn:hover{background:#fff;color:var(--ink);}
.root-stem-down{
  width:2px;
  height:22px;
  background:var(--grid);
  margin:0 auto;
}
.root-branches-wrap{
  position:relative;
  padding-top:22px;
}
.root-branches-wrap::before{
  content:'';
  position:absolute;
  top:0;
  left:10%;
  right:10%;
  height:2px;
  background:var(--grid);
}
.root-branches{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:18px 16px;
  position:relative;
}
.root-word-branch{
  position:relative;
  padding-top:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.root-word-branch::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  width:2px;
  height:22px;
  background:var(--grid);
  transform:translateX(-50%);
}
.root-word-node{
  position:relative;
  width:152px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.04);
  border-top:3px solid var(--success);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  padding:11px 12px 10px;
  text-align:center;
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.root-word-node:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.root-word-branch[data-depth="2"] .root-word-node{border-top-color:var(--accent-blue);}
.root-word-branch[data-depth="3"] .root-word-node{border-top-color:var(--accent);}
.root-word-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.root-word-text{
  font-family:inherit;
  font-weight:700;
  font-size:14px;
  word-break:break-word;
}
.root-word-meaning{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:4px;
  word-break:break-word;
}

/* 编辑与删除按钮样式 */
.root-word-actions{
  position:absolute;
  top:-8px;
  right:-8px;
  display:flex;
  gap:4px;
  opacity:0;
  transition:opacity 0.15s;
}
.root-word-node:hover .root-word-actions{opacity:1;}
.root-word-action-btn{
  width:20px;
  height:20px;
  border-radius:50%;
  border:none;
  background:#fff;
  color:var(--ink-soft);
  font-size:11px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}
.root-word-action-btn:hover{background:var(--accent);color:#fff;}

.root-word-add-child{
  margin-top:7px;
  width:100%;
  font-size:10.5px;
  padding:4px 6px;
  border:1px dashed var(--grid);
  background:transparent;
  color:var(--ink-soft);
  border-radius:var(--r-pill);
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
}
.root-word-add-child:hover{border-color:var(--accent);color:var(--accent);}
.child-add-form{
  display:none;
  flex-direction:column;
  gap:6px;
  width:152px;
  margin-top:9px;
  padding-top:9px;
  border-top:1px dashed var(--grid);
}
.child-add-form.open{display:flex;}
.child-add-form input{
  font-size:12px;
  padding:6px 8px;
}
.child-add-form .btn{align-self:flex-end;}
.root-empty-hint{
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
  padding:16px 0 4px;
}
.root-add-word-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
  padding-top:16px;
  border-top:1px dashed var(--grid);
}
.root-add-word-row input{
  flex:1;
  min-width:110px;
}

/* ---- Apple Notes Layout (Rich Text Upgrade without Image Upload) ---- */
.notes-container {
  display: flex;
  height: 650px;
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.04);
  margin: 0 auto 24px auto;
  max-width: 1000px;
}
.notes-sidebar {
  width: 280px;
  border-right: 1px solid var(--grid);
  display: flex;
  flex-direction: column;
  background: rgba(245,245,247,0.5);
  flex-shrink: 0;
}
.notes-sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--grid);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.notes-sidebar-title {
  font-weight: 700;
  font-size: 14px;
}
.notes-list {
  flex: 1;
  overflow-y: auto;
}
.note-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--grid);
  cursor: pointer;
  transition: background 0.15s ease;
}
.note-item:hover {
  background: rgba(0,0,0,0.03);
}
.note-item.active {
  background: var(--accent-blue);
  color: #fff;
  border-bottom-color: transparent;
}
.note-item-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-item.active .note-item-title {
  color: #fff;
}
.note-item-meta {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-item.active .note-item-meta {
  color: rgba(255,255,255,0.8);
}
.note-item-date {
  font-weight: 600;
  flex-shrink: 0;
}
.note-item-snippet {
  opacity: 0.8;
  overflow: hidden;
  text-overflow: ellipsis;
}
.notes-editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
}
.notes-editor-toolbar {
  padding: 12px 24px;
  background: #fafafa;
  border-bottom: 1px solid var(--grid);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rt-tools {
  display: flex;
  gap: 8px;
  align-items: center;
}
.rt-select {
  padding: 4px 8px;
  font-size: 13px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  outline: none;
  background: #fff;
}
.notes-editor-content-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 40px 40px 40px;
  overflow-y: auto;
}
.note-title-input {
  border: none !important;
  box-shadow: none !important;
  font-size: 24px !important;
  font-weight: 700 !important;
  padding: 16px 0 10px 0 !important;
  margin-bottom: 10px;
  background: transparent !important;
  color: var(--ink) !important;
}

/* 富文本编辑区样式 */
.note-content-editor {
  flex: 1;
  outline: none;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  min-height: 200px;
}
.note-content-editor[placeholder]:empty:before {
  content: attr(placeholder);
  color: var(--muted);
  pointer-events: none;
  display: block;
}

.note-empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
  background: #fff;
}

/* ---- Review session ---- */
.session-setup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.session-setup select{width:auto;min-width:160px;}

.flashcard{
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  background:#fff;
  box-shadow:var(--shadow-sm);

  flex-direction:column;
  align-items:center;

}

<script>
let entries = [];
let editingId = null;
let roots = [];
let editingRootNodeId = null;
let notes = [];
let activeNoteId = null;

const STORAGE_KEY = 'vocab-notebook-entries';
const ROOTS_KEY = 'vocab-notebook-roots';
const NOTES_KEY = 'vocab-notebook-notes';
const DAY = 24*60*60*1000;
const LEVEL_INTERVALS = [1,1,2,4,7,15,30];

/* ============ STORAGE ============ */

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      entries = JSON.parse(raw);
    }
  }catch(e){
    entries = [];
  }
  entries.forEach(e => {
    if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
    if(typeof e.nextReview !== 'number') e.nextReview = Date.now();
    if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
  });
  render();
  renderReview();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Save failed', e);
  }
  updateDueBadge();
}

/* ---- Roots storage ---- */

function loadRoots(){
  try{
    const raw = localStorage.getItem(ROOTS_KEY);
    if(raw) roots = JSON.parse(raw);
  }catch(e){
    roots = [];
  }
  normalizeRoots(roots);
  renderRoots();
}

function normalizeRoots(rootList){
  rootList.forEach(r => {
    if(!Array.isArray(r.words)) r.words = [];
    if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
    if(typeof r.reviewLevel !== 'number') r.reviewLevel = 0;
    if(typeof r.nextReview !== 'number') r.nextReview = Date.now();
    if(typeof r.lastReviewed !== 'number') r.lastReviewed = 0;
    normalizeWordNodes(r.words);
  });
}
function normalizeWordNodes(nodes){
  nodes.forEach(n => {
    if(!Array.isArray(n.children)) n.children = [];
    normalizeWordNodes(n.children);
  });
}

function saveRoots(){
  try{
    localStorage.setItem(ROOTS_KEY, JSON.stringify(roots));
  }catch(e){
    console.error('Save failed', e);
  }
}

/* ---- Notes Storage ---- */
function loadNotes() {
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    if(raw) notes = JSON.parse(raw);
  } catch(e) {
    notes = [];
  }
  if (notes.length > 0) {
    activeNoteId = notes[0].id;
  }
  renderNotesList();
  renderNoteEditor();
}

function saveNotes() {
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  } catch(e) {
    console.error('Save failed', e);
  }
}

/* ============ TABS ============ */

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if(tab === 'review') renderReview();
  if(tab === 'quiz') renderQuizSetup();
  if(tab === 'roots') renderRoots();
  if(tab === 'notes') {
    renderNotesList();
    renderNoteEditor();
  }
}

function updateDueBadge(){
  const due = entries.filter(e => (e.translation || e.note) && e.nextReview <= Date.now()).length + dueRoots().length;
  const filebarBadge = document.getElementById('due-badge');
  const tabBadge = document.getElementById('review-tab-badge');
  if(due > 0){
    filebarBadge.style.display = 'inline-block';
    filebarBadge.textContent = `${due} due today`;
    tabBadge.style.display = 'inline-block';
    tabBadge.textContent = due;
  }else{
    filebarBadge.style.display = 'none';
    tabBadge.style.display = 'none';
  }
}

/* ============ RICH TEXT EDITOR TOOLS ============ */

// 格式化文本函数
function formatDoc(cmd, value = null) {
  document.execCommand(cmd, false, value);
  const editor = document.getElementById('note-content');
  if (editor) editor.focus();
  updateActiveNote();
}

/* ============ NOTES APP ============ */

function createNewNote() {
  const newNote = {
    id: 'n' + Date.now(),
    title: '新笔记',
    content: '',
    updatedAt: Date.now()
  };
  notes.unshift(newNote);
  activeNoteId = newNote.id;
  saveNotes();
  renderNotesList();
  renderNoteEditor();
  setTimeout(() => {
    const titleInput = document.getElementById('note-title');
    if(titleInput) {
      titleInput.focus();
      titleInput.select();
    }
  }, 50);
}

function selectNote(id) {
  activeNoteId = id;
  renderNotesList();
  renderNoteEditor();
}

function deleteNote(id) {
  if(!confirm('确定要删除这篇笔记吗？')) return;
  notes = notes.filter(n => n.id !== id);
  if(activeNoteId === id) {
    activeNoteId = notes.length > 0 ? notes[0].id : null;
  }
  saveNotes();
  renderNotesList();
  renderNoteEditor();
}

function updateActiveNote() {
  if(!activeNoteId) return;
  const note = notes.find(n => n.id === activeNoteId);
  if(note) {
    note.title = document.getElementById('note-title').value;
    // 抓取富文本框的 HTML 内容，而不是纯文本
    note.content = document.getElementById('note-content').innerHTML;
    note.updatedAt = Date.now();
    saveNotes();
    renderNotesList(); // 只更新左侧列表，不重绘右侧以免丢失光标
  }
}

function getNoteSnippet(htmlContent) {
  if(!htmlContent) return '无额外内容';
  
  // 利用临时 DOM 元素剥离掉 HTML 标签，只提取纯文本做预览
  const temp = document.createElement('div');
  temp.innerHTML = htmlContent;
  const text = temp.textContent || temp.innerText || '';
  
  const cleanText = text.replace(/\n/g, ' ').trim();
  return cleanText.length > 20 ? cleanText.substring(0, 20) + '...' : (cleanText || '无额外内容');
}

function formatNoteDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  return String(d.getMonth()+1) + '/' + String(d.getDate());
}

function renderNotesList() {
  const container = document.getElementById('notes-list');
  if(!container) return;
  
  if (notes.length === 0) {
    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 13px;">点击上方 + 创建新笔记</div>';
    return;
  }

  // 按照更新时间排序
  const sortedNotes = [...notes].sort((a,b) => b.updatedAt - a.updatedAt);

  container.innerHTML = sortedNotes.map(n => `
    <div class="note-item ${n.id === activeNoteId ? 'active' : ''}" onclick="selectNote('${n.id}')">
      <div class="note-item-title">${escapeHtml(n.title) || '无标题'}</div>
      <div class="note-item-meta">
        <span class="note-item-date">${formatNoteDate(n.updatedAt)}</span>
        <span class="note-item-snippet">${escapeHtml(getNoteSnippet(n.content))}</span>
      </div>
    </div>
  `).join('');
}

function renderNoteEditor() {
  const editor = document.getElementById('notes-editor');
  if(!editor) return;

  if(!activeNoteId) {
    editor.innerHTML = '<div class="note-empty-state">请选择或创建一篇笔记</div>';
    return;
  }

  const note = notes.find(n => n.id === activeNoteId);
  if(!note) return;

  // 使用 contenteditable 代替原有的 textarea 以支持富文本
  editor.innerHTML = `
    <div class="notes-editor-toolbar">
      <div class="rt-tools">
        <button class="btn btn-ghost btn-sm btn-icon" onmousedown="
