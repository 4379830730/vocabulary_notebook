<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vocabulary Notebook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --paper:#F5F5F7;
  --ink:#1D1D1F;
  --ink-soft:#6E6E73;
  --accent:#FF6B4A;
  --accent-blue:#0A84FF;
  --accent-purple:#8B5CF6;
  --grid:#E6E6EA;
  --success:#30B265;
  --warn:#FFB020;
  --danger:#FF453A;
  --muted:#AEAEB4;
  --card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lift:0 10px 30px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --r-pill:999px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Open Sans', 'PingFang SC', 'Helvetica Neue', sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  line-height:1.55;
  padding:0 0 80px;
  -webkit-font-smoothing:antialiased;
}

/* ---- Top bar ---- */
.filebar{
  background:rgba(29,29,31,0.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  color:rgba(255,255,255,0.92);
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-size:13px;
  font-weight:600;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.filebar .tag{
  background:var(--accent);
  color:#fff;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:600;
  font-size:11px;
  margin-left:8px;
}
.filebar .count{color:rgba(255,255,255,0.6); font-weight:500;}
.filebar .due-badge{
  background:var(--warn);
  color:#1D1D1F;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:700;
  font-size:11px;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:36px 24px 0;
}

/* ---- Tabs ---- */
.tabs{
  display:inline-flex;
  gap:2px;
  margin-bottom:28px;
  background:rgba(120,120,128,0.12);
  padding:4px;
  border-radius:var(--r-pill);
  flex-wrap:wrap;
}
.tab-btn{
  font-family:inherit;
  font-size:13px;
  background:none;
  border:none;
  padding:8px 18px;
  cursor:pointer;
  color:var(--ink-soft);
  border-radius:var(--r-pill);
  font-weight:500;
  transition:all 0.2s ease;
}
.tab-btn.active{
  color:var(--ink);
  background:#fff;
  box-shadow:var(--shadow-sm);
  font-weight:600;
}
.tab-btn .badge{
  background:var(--accent);
  color:#fff;
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-size:10px;
  margin-left:6px;
  font-weight:700;
}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ---- Frames ---- */
.add-frame, .session-frame{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
  padding:26px 28px;
  margin:0 auto 24px auto;
  max-width:880px;
}
.frame-label{
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-grid-2{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-row-full{margin-bottom:14px;}

label.field-label{
  display:block;
  font-size:11px;
  color:var(--ink-soft);
  font-weight:600;
  margin-bottom:6px;
}

input[type="text"], input[type="number"], textarea, select{
  width:100%;
  border:1px solid var(--grid);
  border-radius:var(--r-sm);
  padding:10px 13px;
  font-family:inherit;
  font-size:14px;
  color:var(--ink);
  background:#FAFAFB;
  transition:all 0.15s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus{
  outline:none;
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 4px rgba(255,107,74,0.12);
}
textarea{resize:vertical;min-height:54px;}
.sentence-textarea {min-height:80px; font-size:15px;}

.btn{
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  border:none;
  border-radius:var(--r-pill);
  padding:10px 20px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  transition:opacity 0.15s ease, transform 0.1s ease;
}
.btn:hover{opacity:0.85;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.btn-ghost{background:rgba(120,120,128,0.12); color:var(--ink-soft);}
.btn-ghost:hover{background:rgba(120,120,128,0.2); color:var(--ink); opacity:1;}
.btn-danger{background:rgba(255,69,58,0.1); color:var(--danger);}
.btn-danger:hover{background:var(--danger); color:#fff; opacity:1;}
.btn-success{background:var(--success); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-warn{background:rgba(255,176,32,0.16); color:#B9781A;}
.btn-warn:hover{background:var(--warn); color:#fff; opacity:1;}
.btn-sm{padding:6px 14px; font-size:12px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
  align-items:center;
  max-width:880px;
  margin-left:auto;
  margin-right:auto;
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.toolbar select{width:auto;min-width:110px;}
.empty-msg{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:48px 20px;
  border:1.5px dashed var(--grid);
  border-radius:var(--r-lg);
  background:rgba(120,120,128,0.04);
}

/* ---- Entry Grid ---- */
#words-entries, #sentences-entries{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
  align-items:stretch;
}
#words-entries .empty-msg, #sentences-entries .empty-msg{grid-column:1 / -1;}
@media (max-width:1080px){ #words-entries, #sentences-entries{grid-template-columns:repeat(3, 1fr);} }
@media (max-width:800px){ #words-entries, #sentences-entries{grid-template-columns:repeat(2, 1fr);} }
@media (max-width:520px){ #words-entries, #sentences-entries{grid-template-columns:1fr;} }

.entry{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  transition:box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}
.entry:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.entry.type-phrase{border-top:3px solid var(--success);}
.entry.type-word{border-top:3px solid var(--accent);}
.entry.type-sentence{border-top:3px solid var(--accent-blue);}
.entry.editing{grid-column:1 / -1;}
.entry.in-today-plan{
  box-shadow:0 0 0 2px var(--accent), var(--shadow-sm);
}

.entry-term-row{display:flex;align-items:flex-start;gap:6px;}
.entry-term{
  font-weight:700;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.4;
  flex:1;
}
.type-badge, .tag-badge, .level-badge, .status-badge{
  font-size:10px;
  border-radius:var(--r-pill);
  padding:3px 9px;
  font-weight:600;
}
.type-badge{background:rgba(120,120,128,0.12); color:var(--ink-soft);}
.tag-badge{background:rgba(10,132,255,0.1); color:var(--accent-blue);}
.level-badge{background:rgba(120,120,128,0.12); color:var(--ink-soft);}
.status-badge.new{background:rgba(139,92,246,0.12); color:var(--accent-purple);}
.status-badge.due{background:rgba(255,176,32,0.18); color:#B9781A;}
.status-badge.learned{background:rgba(48,178,101,0.12); color:var(--success);}

.entry-translation{color:var(--ink-soft); font-size:13.5px; margin-bottom:4px; white-space:pre-wrap;}
.entry-note{font-size:13px; color:var(--ink); background:rgba(120,120,128,0.06); border-radius:var(--r-sm); padding:10px 12px; margin-top:8px; white-space:pre-wrap;}
.entry-date{font-size:10px; color:var(--muted); margin-top:6px;}
.entry-badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0 8px;}
.entry-footer{margin-top:auto; padding-top:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.entry-actions{display:flex; gap:6px;}

.speak-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  background:rgba(120,120,128,0.12);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  padding:0;
  transition:background 0.15s, color 0.15s;
}
.speak-btn:hover{background:var(--ink);color:#fff;}
.speak-btn.speaking{background:var(--accent);color:#fff;}
.speak-icon{width:14px; height:14px; pointer-events:none;}

/* ============ 墨墨背单词风 · 选词与背词中心 ============ */
.maimemo-dashboard{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
  margin-bottom:24px;
}
@media (max-width:640px){ .maimemo-dashboard{grid-template-columns:1fr;} }

.stat-box{
  background:#FAFAFB;
  border:1px solid var(--grid);
  border-radius:var(--r-md);
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.stat-box-title{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.stat-box-num{font-size:30px; font-weight:800; line-height:1.1;}
.stat-box-sub{font-size:11px; color:var(--muted); margin-top:6px;}

.word-picker-panel{
  border:1px solid var(--grid);
  border-radius:var(--r-md);
  background:#FAFAFB;
  padding:18px;
  margin-top:20px;
}
.word-picker-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--grid);
}
.picker-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(195px, 1fr));
  gap:10px;
  max-height:360px;
  overflow-y:auto;
  padding:4px 2px;
}
.picker-item{
  background:#fff;
  border:1.5px solid var(--grid);
  border-radius:var(--r-sm);
  padding:10px 12px;
  cursor:pointer;
  display:flex;
  align-items:flex-start;
  gap:10px;
  transition:all 0.15s ease;
  user-select:none;
}
.picker-item:hover{border-color:var(--ink-soft);}
.picker-item.selected{
  border-color:var(--accent);
  background:rgba(255,107,74,0.05);
}
.picker-checkbox{
  width:18px;
  height:18px;
  border-radius:5px;
  border:1.5px solid var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  margin-top:2px;
  font-size:12px;
  color:#fff;
  transition:all 0.15s;
}
.picker-item.selected .picker-checkbox{
  background:var(--accent);
  border-color:var(--accent);
}
.picker-word{font-weight:700; font-size:14px; line-height:1.3; word-break:break-word;}
.picker-trans{font-size:12px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:135px;}

/* 拼写默写卡片 */
.study-container{max-width:640px; margin:0 auto; text-align:center;}
.study-progress-bar{
  width:100%;
  height:6px;
  background:var(--grid);
  border-radius:var(--r-pill);
  overflow:hidden;
  margin-bottom:16px;
}
.study-progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--accent), var(--success));
  transition:width 0.3s ease;
}
.study-card{
  background:#fff;
  border:1px solid var(--grid);
  border-radius:var(--r-lg);
  padding:36px 32px;
  box-shadow:var(--shadow-sm);
  margin-bottom:20px;
}
.study-mode-pill{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:4px 12px;
  border-radius:var(--r-pill);
  margin-bottom:14px;
}
.study-mode-pill.learn{background:rgba(139,92,246,0.12); color:var(--accent-purple);}
.study-mode-pill.review{background:rgba(255,176,32,0.18); color:#B9781A;}
.study-mode-pill.reinforce{background:rgba(255,69,58,0.12); color:var(--danger);}

.spell-meaning{
  font-size:25px;
  font-weight:700;
  color:var(--ink);
  line-height:1.35;
  margin-bottom:12px;
  white-space:pre-wrap;
}
.spell-hint{
  font-size:13.5px;
  color:var(--ink-soft);
  background:rgba(120,120,128,0.06);
  padding:10px 16px;
  border-radius:var(--r-sm);
  display:inline-block;
  margin-bottom:20px;
  max-width:100%;
  white-space:pre-wrap;
  text-align:left;
}
.spell-input-wrap{
  position:relative;
  max-width:440px;
  margin:0 auto 16px auto;
}
.spell-input{
  font-family:'JetBrains Mono', -apple-system, monospace;
  font-size:21px;
  letter-spacing:1px;
  text-align:center;
  padding:14px 18px;
  border:2px solid var(--grid);
  border-radius:var(--r-md);
  outline:none;
  width:100%;
}
.spell-input:focus{
  border-color:var(--accent-blue);
  box-shadow:0 0 0 4px rgba(10,132,255,0.12);
}
.spell-input.correct{
  border-color:var(--success);
  background:rgba(48,178,101,0.08);
  color:var(--success);
}
.spell-input.incorrect{
  border-color:var(--danger);
  background:rgba(255,69,58,0.08);
}
.spell-diff-box{
  margin-top:16px;
  padding:16px;
  border-radius:var(--r-md);
  text-align:left;
  font-size:14px;
  background:#FAFAFB;
  border:1px solid var(--grid);
}
.diff-char-ok{color:var(--success); font-weight:700;}
.diff-char-err{color:var(--danger); font-weight:700; text-decoration:line-through;}
.diff-char-missing{color:var(--accent); font-weight:700; text-decoration:underline;}

/* 曲线阶梯指示器 */
.ebbinghaus-steps{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:14px;
  flex-wrap:wrap;
}
.eb-step{
  font-size:10px;
  padding:3px 8px;
  border-radius:var(--r-pill);
  background:rgba(120,120,128,0.08);
  color:var(--muted);
  font-weight:600;
}
.eb-step.active{
  background:var(--success);
  color:#fff;
}
.eb-step.done{
  background:rgba(48,178,101,0.15);
  color:var(--success);
}

/* ============ 词根与自由笔记保留样式 ============ */
#roots-list{display:flex; flex-direction:column; gap:20px;}
.root-card{position:relative; background:var(--card); border:1px solid rgba(0,0,0,0.04); border-radius:var(--r-lg); box-shadow:var(--shadow-md); padding:26px 24px 22px;}
.root-card-actions{position:absolute; top:18px; right:20px; display:flex; gap:6px;}
.root-node-wrap{display:flex; justify-content:center;}
.root-node{display:flex; align-items:baseline; gap:10px; background:var(--ink); color:#fff; padding:12px 26px; border-radius:var(--r-pill); box-shadow:var(--shadow-sm);}
.root-node-text{font-weight:800; font-size:18px;}
.root-node-meaning{font-size:13px; opacity:0.85;}
.root-stem-down{width:2px; height:22px; background:var(--grid); margin:0 auto;}
.root-branches-wrap{position:relative; padding-top:22px;}
.root-branches-wrap::before{content:''; position:absolute; top:0; left:10%; right:10%; height:2px; background:var(--grid);}
.root-branches{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:18px 16px;}
.root-word-branch{position:relative; padding-top:22px; display:flex; flex-direction:column; align-items:center;}
.root-word-branch::before{content:''; position:absolute; top:0; left:50%; width:2px; height:22px; background:var(--grid); transform:translateX(-50%);}
.root-word-node{position:relative; width:152px; background:#fff; border:1px solid rgba(0,0,0,0.04); border-top:3px solid var(--success); border-radius:var(--r-md); box-shadow:var(--shadow-sm); padding:11px 12px 10px; text-align:center;}
.root-word-node:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.root-word-branch[data-depth="2"] .root-word-node{border-top-color:var(--accent-blue);}
.root-word-branch[data-depth="3"] .root-word-node{border-top-color:var(--accent);}
.root-word-row{display:flex; align-items:center; justify-content:center; gap:4px;}
.root-word-text{font-weight:700; font-size:14px; word-break:break-word;}
.root-word-meaning{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.root-word-actions{position:absolute; top:-8px; right:-8px; display:flex; gap:4px; opacity:0; transition:opacity 0.15s;}
.root-word-node:hover .root-word-actions{opacity:1;}
.root-word-action-btn{width:20px; height:20px; border-radius:50%; border:none; background:#fff; color:var(--ink-soft); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);}
.root-word-add-child{margin-top:7px; width:100%; font-size:10.5px; padding:4px 6px; border:1px dashed var(--grid); background:transparent; color:var(--ink-soft); border-radius:var(--r-pill); cursor:pointer; font-weight:600;}
.child-add-form{display:none; flex-direction:column; gap:6px; width:152px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--grid);}
.child-add-form.open{display:flex;}
.root-add-word-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; padding-top:16px; border-top:1px dashed var(--grid);}
.root-add-word-row input{flex:1; min-width:110px;}

.notes-container { display: flex; height: 650px; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid rgba(0,0,0,0.04); margin: 0 auto 24px auto; max-width: 1000px; }
.notes-sidebar { width: 280px; border-right: 1px solid var(--grid); display: flex; flex-direction: column; background: rgba(245,245,247,0.5); flex-shrink: 0; }
.notes-sidebar-header { padding: 16px; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; align-items: center; }
.notes-sidebar-title { font-weight: 700; font-size: 14px; }
.notes-list { flex: 1; overflow-y: auto; }
.note-item { padding: 14px 16px; border-bottom: 1px solid var(--grid); cursor: pointer; transition: background 0.15s ease; }
.note-item:hover { background: rgba(0,0,0,0.03); }
.note-item.active { background: var(--accent-blue); color: #fff; border-bottom-color: transparent; }
.note-item-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-item.active .note-item-title { color: #fff; }
.note-item-meta { display: flex; gap: 8px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-item.active .note-item-meta { color: rgba(255,255,255,0.8); }
.notes-editor { flex: 1; display: flex; flex-direction: column; background: #fff; }
.notes-editor-toolbar { padding: 14px 24px; display: flex; justify-content: flex-end; }
.notes-editor-content { flex: 1; display: flex; flex-direction: column; padding: 0 40px 40px 40px; overflow-y: auto; }
.note-title-input { border: none !important; box-shadow: none !important; font-size: 24px !important; font-weight: 700 !important; padding: 10px 0 !important; margin-bottom: 10px; background: transparent !important; }
.note-content-textarea { border: none !important; box-shadow: none !important; flex: 1; resize: none; font-size: 15px !important; line-height: 1.6; background: transparent !important; padding: 0 !important; }
.note-empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
.progress-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}

@media (max-width:640px){
  .form-grid, .form-grid-2 {grid-template-columns:1fr;}
  .notes-container { flex-direction: column; height: 800px; }
  .notes-sidebar { width: 100%; height: 300px; border-right: none; border-bottom: 1px solid var(--grid); }
}
</style>
</head>
<body>

<div class="filebar">
  <div>Vocabulary_Notebook <span class="tag">TATA World</span></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span class="due-badge" id="due-badge" style="display:none;"></span>
    <span class="count" id="entry-count">0 entries</span>
  </div>
</div>

<div class="wrap">

  <div class="tabs">
    <button class="tab-btn active" data-tab="study" onclick="switchTab('study')">🔥 今日背词 Study <span class="badge" id="study-tab-badge" style="display:none;"></span></button>
    <button class="tab-btn" data-tab="words" onclick="switchTab('words')">单词与短语 Words</button>
    <button class="tab-btn" data-tab="sentences" onclick="switchTab('sentences')">长句记录 Sentences</button>
    <button class="tab-btn" data-tab="roots" onclick="switchTab('roots')">词根笔记 Roots</button>
    <button class="tab-btn" data-tab="notes" onclick="switchTab('notes')">自由笔记 Notes</button>
  </div>

  <!-- ==================== 1. 墨墨模式：今日背词 (选词 + 艾宾浩斯强制默写) ==================== -->
  <div class="tab-panel active" id="tab-study">
    <div class="session-frame">
      <div class="frame-label">艾宾浩斯抗遗忘 · 每日规划与默写工作台</div>
      <div id="study-content"></div>
    </div>
  </div>

  <!-- ==================== 2. 单词库管理 ==================== -->
  <div class="tab-panel" id="tab-words">
    <div class="add-frame">
      <div class="frame-label">+ 新增单词 / 短语</div>
      <div class="form-grid">
        <div>
          <label class="field-label">单词 / 短语 (English)</label>
          <input type="text" id="word-term" placeholder="e.g. affordance / be passionate about">
        </div>
        <div>
          <label class="field-label">类型</label>
          <select id="word-type">
            <option value="word">单词 Word</option>
            <option value="phrase">短语 Phrase</option>
          </select>
        </div>
        <div>
          <label class="field-label">标签 Tag</label>
          <input type="text" id="word-tag" placeholder="e.g. UX / Interview">
        </div>
      </div>

      <div class="form-row-full">
        <label class="field-label">中文意思 / 翻译（默写时的题目提示）</label>
        <input type="text" id="word-translation" placeholder="对应的中文意思">
      </div>

      <div class="form-row-full">
        <label class="field-label">笔记 / 例句（默写时自动把单词挖空作为语境提示）</label>
        <textarea id="word-note" placeholder="例句、搭配、容易混淆的点等..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn" onclick="addEntry('word', false)">添加到词库</button>
        <button class="btn btn-accent" onclick="addEntry('word', true)">添加并直接框选入「今日背词」</button>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search-words" placeholder="搜索单词/短语..." oninput="render()">
      <select id="filter-status-words" onchange="render()">
        <option value="">全部状态</option>
        <option value="new">未学习新词</option>
        <option value="plan">已框选今日背诵</option>
        <option value="due">今日待复习</option>
        <option value="learned">学习中/已掌握</option>
      </select>
      <select id="filter-type-words" onchange="render()">
        <option value="">全部类型</option>
        <option value="word">单词</option>
        <option value="phrase">短语</option>
      </select>
      <select id="filter-tag-words" onchange="render()">
        <option value="">全部标签</option>
      </select>
      <select id="sort-words" onchange="render()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>

    <div id="words-entries"></div>
  </div>

  <!-- ==================== 3. 长句记录 ==================== -->
  <div class="tab-panel" id="tab-sentences">
    <div class="add-frame">
      <div class="frame-label">+ 新增长句</div>
      <div class="form-grid-2">
        <div>
          <label class="field-label">句子 (English Sentence)</label>
          <textarea id="sentence-term" class="sentence-textarea" placeholder="e.g. I have hands-on experience in leading cross-functional teams..."></textarea>
        </div>
        <div>
          <label class="field-label">标签 Tag</label>
          <input type="text" id="sentence-tag" placeholder="e.g. Interview / Email">
        </div>
      </div>

      <div class="form-row-full">
        <label class="field-label">中文翻译</label>
        <textarea id="sentence-translation" placeholder="对应的中文翻译" style="min-height: 40px;"></textarea>
      </div>

      <div class="form-row-full">
        <label class="field-label">句型分析 / 笔记</label>
        <textarea id="sentence-note" placeholder="这个句子好在哪里？可以替换的词有哪些？"></textarea>
      </div>

      <button class="btn" onclick="addEntry('sentence', false)">添加长句记录</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search-sentences" placeholder="搜索句子..." oninput="render()">
      <select id="filter-tag-sentences" onchange="render()">
        <option value="">全部标签</option>
      </select>
      <select id="sort-sentences" onchange="render()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>

    <div id="sentences-entries"></div>
  </div>

  <!-- ==================== 4. 词根笔记 ==================== -->
  <div class="tab-panel" id="tab-roots">
    <div class="add-frame">
      <div class="frame-label">+ 新增词根</div>
      <div class="form-grid">
        <div>
          <label class="field-label">词根 Root</label>
          <input type="text" id="root-term" placeholder="e.g. spect / port / dict">
        </div>
        <div>
          <label class="field-label">词根含义</label>
          <input type="text" id="root-meaning" placeholder="e.g. 看，看见">
        </div>
      </div>

      <div class="form-row-full">
        <label class="field-label">第一个派生词（可选，之后可以随时继续添加）</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="root-first-word" placeholder="e.g. inspect" style="flex:1;min-width:140px;">
          <input type="text" id="root-first-meaning" placeholder="意思，e.g. 检查，视察" style="flex:1;min-width:140px;">
        </div>
      </div>

      <button class="btn" onclick="addRootGroup()">创建词根笔记</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search-roots" placeholder="搜索词根或派生词..." oninput="renderRoots()">
      <select id="sort-roots" onchange="renderRoots()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>

    <div id="roots-list"></div>
  </div>

  <!-- ==================== 5. 自由笔记 ==================== -->
  <div class="tab-panel" id="tab-notes">
    <div class="notes-container">
      <div class="notes-sidebar">
        <div class="notes-sidebar-header">
          <span class="notes-sidebar-title">自由笔记</span>
          <button class="btn btn-ghost btn-sm" onclick="createNewNote()" title="新建笔记">＋</button>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </div>
      <div class="notes-editor" id="notes-editor"></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">导出全部备份</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">导入备份</button>
    </div>
  </div>

</div>

<input type="file" id="import-file" accept="application/json" style="display:none;" onchange="importData(event)">

<script>
let entries = [];
let editingId = null;
let roots = [];
let editingRootNodeId = null;
let notes = [];
let activeNoteId = null;

const STORAGE_KEY = 'vocab-notebook-entries';
const ROOTS_KEY = 'vocab-notebook-roots';
const NOTES_KEY = 'vocab-notebook-notes';
const DAY = 24 * 60 * 60 * 1000;
const SESSION_KEY = 'vocab-notebook-session';

/* 
  艾宾浩斯遗忘曲线标准复习间隔 (单位：天)
  Lv.0: 未学习新词 (New)
  Lv.1: 1天后复习
  Lv.2: 2天后复习
  Lv.3: 4天后复习
  Lv.4: 7天后复习
  Lv.5: 15天后复习
  Lv.6: 30天后复习
  Lv.7: 60天后复习 (深度掌握)
*/
const EBBINGHAUS_DAYS = [0, 1, 2, 4, 7, 15, 30, 60];

/* ============ STORAGE & NORMALIZATION ============ */
function getEndOfToday(){
  const d = new Date();
  d.setHours(23, 59, 59, 999);
  return d.getTime();
}

function getStartOfTomorrow(){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime() + DAY;
}

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) entries = JSON.parse(raw);
  }catch(e){
    entries = [];
  }
  entries.forEach(e => {
    if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
    if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
    if(typeof e.nextReview !== 'number') e.nextReview = 0;
    if(typeof e.inTodayPlan !== 'boolean') e.inTodayPlan = false;
    if(typeof e.spellCount !== 'number') e.spellCount = 0;
    if(typeof e.spellCorrect !== 'number') e.spellCorrect = 0;
  });
  render();
  renderStudyView();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Save failed', e);
  }
  updateBadges();
}

function loadRoots(){
  try{
    const raw = localStorage.getItem(ROOTS_KEY);
    if(raw) roots = JSON.parse(raw);
  }catch(e){
    roots = [];
  }
  normalizeRoots(roots);
  renderRoots();
}

function normalizeRoots(rootList){
  rootList.forEach(r => {
    if(!Array.isArray(r.words)) r.words = [];
    if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
    normalizeWordNodes(r.words);
  });
}
function normalizeWordNodes(nodes){
  nodes.forEach(n => {
    if(!Array.isArray(n.children)) n.children = [];
    normalizeWordNodes(n.children);
  });
}

function saveRoots(){
  try{
    localStorage.setItem(ROOTS_KEY, JSON.stringify(roots));
  }catch(e){
    console.error('Save failed', e);
  }
}

function loadNotes() {
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    if(raw) notes = JSON.parse(raw);
  } catch(e) {
    notes = [];
  }
  if (notes.length > 0) activeNoteId = notes[0].id;
  renderNotesList();
  renderNoteEditor();
}

function saveNotes() {
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  } catch(e) {
    console.error('Save failed', e);
  }
}

/* ============ TABS & BADGES ============ */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if(tab === 'study') renderStudyView();
  if(tab === 'words' || tab === 'sentences') render();
  if(tab === 'roots') renderRoots();
  if(tab === 'notes') {
    renderNotesList();
    renderNoteEditor();
  }
}

/* 区分：未学新词、今日已选新词、今日到期旧词 */
function isWordEligible(e){
  return e.type !== 'sentence' && e.term && e.term.trim().length > 0;
}

function isNewWord(e){
  return isWordEligible(e) && e.reviewLevel === 0 && e.lastReviewed === 0;
}

function isDueReviewWord(e){
  const endToday = getEndOfToday();
  return isWordEligible(e) && (e.reviewLevel > 0 || e.lastReviewed > 0) && e.nextReview <= endToday;
}

function getTodayPlannedNewWords(){
  return entries.filter(e => isNewWord(e) && e.inTodayPlan);
}

function getTodayDueReviewWords(){
  return entries.filter(e => isDueReviewWord(e));
}

function updateBadges(){
  const plannedNew = getTodayPlannedNewWords().length;
  const dueReview = getTodayDueReviewWords().length;
  const totalTask = plannedNew + dueReview;

  const filebarBadge = document.getElementById('due-badge');
  const studyTabBadge = document.getElementById('study-tab-badge');

  if(totalTask > 0){
    filebarBadge.style.display = 'inline-block';
    filebarBadge.textContent = `今日待背: 新词 ${plannedNew} · 复习 ${dueReview}`;
    studyTabBadge.style.display = 'inline-block';
    studyTabBadge.textContent = totalTask;
  }else{
    filebarBadge.style.display = 'none';
    studyTabBadge.style.display = 'none';
  }
}

/* ============ 墨墨模式：每日选词 + 艾宾浩斯强制拼写学习引擎 ============ */
let studySessionActive = false;
let studyQueue = []; // 元素结构: { entryId: 'e123', phase: 'intro' | 'spell', isNew: true/false, retried: false }
let studyCurrentIndex = 0;
let studyChecked = false;
let studyStats = { newLearned: 0, reviewed: 0, firstTryPass: 0, totalItems: 0, retryCount: 0 };
let pickerSearchQuery = '';
let pickerTagFilter = '';

function togglePlanWord(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  e.inTodayPlan = !e.inTodayPlan;
  saveEntries();
  renderStudyView();
  render();
}

function quickSelectNewWords(count){
  const unpicked = entries.filter(e => isNewWord(e) && !e.inTodayPlan && matchesPickerFilter(e));
  const chosen = unpicked.slice(0, count);
  chosen.forEach(e => e.inTodayPlan = true);
  saveEntries();
  renderStudyView();
  render();
}

function clearPlannedNewWords(){
  entries.forEach(e => { if(isNewWord(e)) e.inTodayPlan = false; });
  saveEntries();
  renderStudyView();
  render();
}

function matchesPickerFilter(e){
  if(pickerTagFilter && e.tag !== pickerTagFilter) return false;
  if(pickerSearchQuery){
    const q = pickerSearchQuery.toLowerCase();
    return [e.term, e.translation, e.tag].join(' ').toLowerCase().includes(q);
  }
  return true;
}

function renderStudyView(){
  updateBadges();
  const container = document.getElementById('study-content');
  if(!container) return;

  if(studySessionActive){
    if(studyCurrentIndex < studyQueue.length){
      renderActiveStudyCard(container);
    }else{
      renderStudySummary(container);
    }
    return;
  }

  const plannedNew = getTodayPlannedNewWords();
  const dueReviews = getTodayDueReviewWords();
  const allUnlearned = entries.filter(e => isNewWord(e));
  const allLearned = entries.filter(e => isWordEligible(e) && !isNewWord(e));
  const totalToday = plannedNew.length + dueReviews.length;

  const wordTags = [...new Set(allUnlearned.map(e => e.tag).filter(Boolean))].sort();
  const filteredUnlearned = allUnlearned.filter(matchesPickerFilter);

  container.innerHTML = `
    <div>
      <!-- 墨墨式三栏看板 -->
      <div class="maimemo-dashboard">
        <div class="stat-box" style="border-top: 3px solid var(--accent);">
          <div class="stat-box-title">📌 今日已框选新词 (New)</div>
          <div class="stat-box-num" style="color:var(--accent);">${plannedNew.length}</div>
          <div class="stat-box-sub">待学新词库剩余 ${allUnlearned.length - plannedNew.length} 词</div>
        </div>
        <div class="stat-box" style="border-top: 3px solid var(--warn);">
          <div class="stat-box-title">⏰ 艾宾浩斯到期复习 (Due)</div>
          <div class="stat-box-num" style="color:#B9781A;">${dueReviews.length}</div>
          <div class="stat-box-sub">根据遗忘曲线今日必须默写巩固</div>
        </div>
        <div class="stat-box" style="border-top: 3px solid var(--success);">
          <div class="stat-box-title">📈 累计已进入记忆曲线</div>
          <div class="stat-box-num" style="color:var(--success);">${allLearned.length}</div>
          <div class="stat-box-sub">通过强制默写抗遗忘</div>
        </div>
      </div>

      ${(() => { const r = getResumableSession(); return r ? `
      <div style="background:#FFF7E6; border:1px solid #FFD591; border-radius:var(--r-md); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
        <div style="font-size:14px; font-weight:600; color:#8A5A00;">上次背词还没背完，剩余 ${r.remaining} 项（进度已保存）</div>
        <div class="btn-row">
          <button class="btn btn-accent" onclick="resumeStudySession()">▶ 继续上次背词</button>
          <button class="btn btn-ghost btn-sm" onclick="discardSession()">放弃进度</button>
        </div>
      </div>` : ''; })()}

      <!-- 启动栏 -->
      <div style="background:#FAFAFB; border:1px solid var(--grid); border-radius:var(--r-md); padding:20px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div>
          <div style="font-weight:700; font-size:16px;">
            今日背单词总任务：<span style="color:var(--accent);">${totalToday}</span> 词
            <span style="font-size:13px; color:var(--ink-soft); font-weight:500;">（含 ${plannedNew.length} 个新词认读+默写 + ${dueReviews.length} 个旧词艾宾浩斯默写）</span>
          </div>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">
            规则：新词第一次出现先认读（认识/不认识），点“认识”后第二次出现时打字默写；旧词直接盲默写；拼错的词会排入队尾反复强化。中途退出进度会自动保存。
          </div>
        </div>
        <button class="btn btn-accent" style="padding:12px 28px; font-size:15px;" onclick="startStudySession()" ${totalToday === 0 ? 'disabled' : ''}>
          🚀 开始今日背词 (${totalToday})
        </button>
      </div>

      <!-- 每日框选新词面板 (类似墨墨选词) -->
      <div class="word-picker-panel">
        <div class="word-picker-toolbar">
          <div>
            <span style="font-weight:700; font-size:14px;">🗂️ 框选今日要背的新词</span>
            <span style="font-size:12px; color:var(--ink-soft); margin-left:6px;">(点击卡片勾选/取消，已选 <b>${plannedNew.length}</b> 个)</span>
          </div>
          <div class="btn-row">
            <input type="text" placeholder="筛选新词..." value="${escapeHtml(pickerSearchQuery)}" oninput="pickerSearchQuery=this.value; renderStudyView();" style="width:140px; padding:6px 10px; font-size:12px;">
            <select onchange="pickerTagFilter=this.value; renderStudyView();" style="width:auto; padding:6px 10px; font-size:12px;">
              <option value="">全部标签</option>
              ${wordTags.map(t => `<option value="${escapeHtml(t)}" ${pickerTagFilter===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
            </select>
            <button class="btn btn-ghost btn-sm" onclick="quickSelectNewWords(10)">+ 随机选 10 词</button>
            <button class="btn btn-ghost btn-sm" onclick="quickSelectNewWords(20)">+ 随机选 20 词</button>
            ${plannedNew.length > 0 ? `<button class="btn btn-danger btn-sm" onclick="clearPlannedNewWords()">清空已选</button>` : ''}
          </div>
        </div>

        ${filteredUnlearned.length === 0 ? `
          <div style="text-align:center; padding:32px 10px; color:var(--muted); font-size:13px;">
            ${allUnlearned.length === 0 ? '词库中所有单词都已经进入艾宾浩斯学习曲线啦！去「单词与短语」添加新词吧。' : '没有匹配的未学新词'}
          </div>
        ` : `
          <div class="picker-grid">
            ${filteredUnlearned.map(e => `
              <div class="picker-item ${e.inTodayPlan ? 'selected' : ''}" onclick="togglePlanWord('${e.id}')">
                <div class="picker-checkbox">${e.inTodayPlan ? '✓' : ''}</div>
                <div style="min-width:0; flex:1;">
                  <div class="picker-word">${escapeHtml(e.term)}</div>
                  <div class="picker-trans">${escapeHtml(e.translation || '暂无中文释义')}</div>
                  ${e.tag ? `<span class="tag-badge" style="display:inline-block; margin-top:4px; padding:1px 6px;">${escapeHtml(e.tag)}</span>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

function startStudySession(){
  const plannedNew = shuffle(getTodayPlannedNewWords());
  const dueReviews = shuffle(getTodayDueReviewWords());

  if(plannedNew.length === 0 && dueReviews.length === 0) return;

  if(getResumableSession() && !confirm('有一次没背完的进度，重新开始会覆盖它。确定重新开始吗？\n（想接着背请点"继续上次背词"）')) return;

  // 新词：第一次出现 = 认读（认识/不认识）；点"认识"后，过几张卡再出现一次 = 打字默写
  // 旧词：直接打字默写
  studyQueue = [];
  plannedNew.forEach(e => {
    studyQueue.push({ entryId: e.id, phase: 'recog', isNew: true, retried: false });
  });
  dueReviews.forEach(e => {
    studyQueue.push({ entryId: e.id, phase: 'spell', isNew: false, retried: false });
  });
  studyQueue = shuffle(studyQueue);

  studyCurrentIndex = 0;
  studyChecked = false;
  studyStats = {
    newLearned: plannedNew.length,
    reviewed: dueReviews.length,
    firstTryPass: 0,
    totalSpellTargets: plannedNew.length + dueReviews.length,
    retryCount: 0
  };
  studySessionActive = true;
  persistSession();
  renderStudyView();
}

/* ============ 进度保存 / 继续上次背词 ============ */
function persistSession(idx){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      day: getEndOfToday(),
      queue: studyQueue,
      index: (typeof idx === 'number') ? idx : studyCurrentIndex,
      stats: studyStats
    }));
  }catch(e){ console.error('Session save failed', e); }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function getResumableSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const sess = JSON.parse(raw);
    if(!sess || sess.day !== getEndOfToday() || !Array.isArray(sess.queue)) { clearSession(); return null; }
    // 只保留仍然存在的词
    const ids = new Set(entries.map(e => e.id));
    const remaining = sess.queue.slice(sess.index).filter(t => ids.has(t.entryId));
    if(remaining.length === 0){ clearSession(); return null; }
    return { sess, remaining: remaining.length };
  }catch(e){
    return null;
  }
}
function resumeStudySession(){
  const r = getResumableSession();
  if(!r) { renderStudyView(); return; }
  studyQueue = r.sess.queue;
  studyCurrentIndex = r.sess.index;
  studyStats = r.sess.stats || { newLearned: 0, reviewed: 0, firstTryPass: 0, totalSpellTargets: 0, retryCount: 0 };
  studyChecked = false;
  studySessionActive = true;
  renderStudyView();
}
function discardSession(){
  if(!confirm('放弃上次没背完的进度？（已经默写通过的词不受影响）')) return;
  clearSession();
  renderStudyView();
}

/* ============ 新词认读（Anki 式：认识 / 不认识） ============ */
let recogRevealed = false;
function revealRecog(){
  const task = studyQueue[studyCurrentIndex];
  if(!task || task.phase !== 'recog' || recogRevealed) return;
  recogRevealed = true;
  document.getElementById('recog-answer').style.display = 'block';
  document.getElementById('recog-actions').innerHTML = `
    <button class="btn btn-warn" onclick="answerRecog(false)">不认识 (2)</button>
    <button class="btn btn-success" onclick="answerRecog(true)">认识 (1)</button>
  `;
}
function answerRecog(known){
  const task = studyQueue[studyCurrentIndex];
  if(!task || task.phase !== 'recog' || !recogRevealed) return;
  if(known){
    // 第二次出现：打字默写，间隔几张卡之后
    const gap = 4 + Math.floor(Math.random() * 3);
    const pos = Math.min(studyQueue.length, studyCurrentIndex + 1 + gap);
    studyQueue.splice(pos, 0, { entryId: task.entryId, phase: 'spell', isNew: true, retried: false });
  }else{
    // 不认识：几张卡后再认读一次，直到点"认识"才进入打字
    const pos = Math.min(studyQueue.length, studyCurrentIndex + 1 + 3);
    studyQueue.splice(pos, 0, { entryId: task.entryId, phase: 'recog', isNew: true, retried: false });
  }
  studyCurrentIndex++;
  renderStudyView();
}
document.addEventListener('keydown', function(ev){
  if(!studySessionActive || studyCurrentIndex >= studyQueue.length) return;
  const tabEl = document.getElementById('tab-study');
  if(!tabEl || !tabEl.classList.contains('active')) return;
  const task = studyQueue[studyCurrentIndex];
  if(!task || task.phase !== 'recog') return;
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return;
  if(!recogRevealed){
    if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); revealRecog(); }
  }else{
    if(ev.key === '1'){ answerRecog(true); }
    else if(ev.key === '2'){ answerRecog(false); }
  }
});

/* 构建例句挖空（隐藏目标单词，防剧透） */
function buildClozeNote(note, term){
  if(!note) return '';
  const escaped = term.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if(!escaped) return note;
  const regex = new RegExp(escaped, 'gi');
  return note.replace(regex, ' ______ ');
}

function renderEbbinghausStepsHTML(currentLv){
  const labels = ['新词', '1天', '2天', '4天', '7天', '15天', '30天', '60天'];
  return `
    <div class="ebbinghaus-steps">
      ${labels.map((lb, idx) => {
        let cls = '';
        if(idx < currentLv) cls = 'done';
        else if(idx === currentLv) cls = 'active';
        return `<span class="eb-step ${cls}">Lv.${idx} (${lb})</span>`;
      }).join('')}
    </div>
  `;
}

function checkIntroCopy(){
  const task = studyQueue[studyCurrentIndex];
  const item = entries.find(e => e.id === task.entryId);
  const inputEl = document.getElementById('study-input-box');
  const val = inputEl.value.trim();

  if(val.toLowerCase() !== item.term.trim().toLowerCase()){
    inputEl.classList.add('incorrect');
    document.getElementById('study-feedback-area').innerHTML = `
      <div style="color:var(--danger); font-size:13px; margin-top:6px;">请准确对照上方单词 <b>${escapeHtml(item.term)}</b> 输入一遍再继续哦</div>
    `;
    inputEl.focus();
    return;
  }
  studyCurrentIndex++;
  renderStudyView();
}

function giveLetterHint(){
  const task = studyQueue[studyCurrentIndex];
  const item = entries.find(e => e.id === task.entryId);
  if(!item) return;
  task.usedHint = true; // 使用提示则本轮不算独立一次通过，需在队尾重默一次
  const t = item.term.trim();
  const masked = t.length <= 2 ? t[0] + '_' : t[0] + ' ' + '_ '.repeat(t.length - 2) + t[t.length - 1];
  const fb = document.getElementById('study-feedback-area');
  fb.innerHTML = `<div style="font-size:13px; color:#B9781A; margin-bottom:8px;">提示结构：<b>${escapeHtml(masked)}</b>（共 ${t.length} 个字符，使用提示后稍后需再独立默写一次）</div>`;
  document.getElementById('study-input-box').focus();
}

function submitBlindSpelling(giveUp){
  if(studyChecked) return;
  const inputEl = document.getElementById('study-input-box');
  const userVal = giveUp ? '' : inputEl.value.trim();
  if(!giveUp && !userVal){
    inputEl.focus();
    return;
  }

  studyChecked = true;
  inputEl.disabled = true;

  const task = studyQueue[studyCurrentIndex];
  const item = entries.find(e => e.id === task.entryId);
  const expected = item.term.trim();
  const isExactMatch = !giveUp && (userVal.toLowerCase() === expected.toLowerCase());

  item.spellCount = (item.spellCount || 0) + 1;
  const now = Date.now();
  const fb = document.getElementById('study-feedback-area');
  const actBar = document.getElementById('study-action-bar');

  // 发音强化
  speak(expected, 'en-US');

  if(isExactMatch && !task.usedHint){
    inputEl.classList.add('correct');
    item.spellCorrect = (item.spellCorrect || 0) + 1;

    // 如果是一次性独立默写通过（非错词重背轮次），正式推进艾宾浩斯等级
    if(!task.retried){
      studyStats.firstTryPass++;
      item.reviewLevel = Math.min((item.reviewLevel || 0) + 1, EBBINGHAUS_DAYS.length - 1);
    }else{
      // 如果是重背轮次拼对，新词至少定级为 Lv.1（1天后复习）
      if(item.reviewLevel === 0) item.reviewLevel = 1;
    }

    const intervalDays = EBBINGHAUS_DAYS[item.reviewLevel] || 1;
    item.lastReviewed = now;
    item.nextReview = getStartOfTomorrow() + (intervalDays - 1) * DAY;
    item.inTodayPlan = false; // 完成今日计划

    fb.innerHTML = `
      <div style="color:var(--success); font-weight:700; font-size:15px; margin-top:12px;">
        ✅ 默写正确！艾宾浩斯记忆等级 Lv.${item.reviewLevel}，下次将于 <b>${intervalDays} 天后</b> (${formatDate(item.nextReview)}) 复习
      </div>
      ${item.note ? `<div style="font-size:13px; color:var(--ink-soft); margin-top:8px;">完整笔记/例句：${escapeHtml(item.note)}</div>` : ''}
    `;
    actBar.innerHTML = `<button class="btn btn-success" id="study-next-btn" onclick="nextStudyTask()">下一个 (Enter)</button>`;
  } else {
    // 拼写错误、放弃、或借助了首尾字母提示 -> 触发艾宾浩斯遗忘惩罚并加入今日队尾重默
    inputEl.classList.add('incorrect');
    studyStats.retryCount++;

    if(!task.retried){
      // 首次拼错：旧词等级回退（最低回退到 Lv.1，明日立刻复习），新词保持 Lv.0 直到重默通过
      if(item.reviewLevel > 1) item.reviewLevel = Math.max(1, item.reviewLevel - 2);
    }

    // 强制推入今日队列末尾，直到完全不看提示拼对为止
    studyQueue.push({
      entryId: item.id,
      phase: 'spell',
      isNew: task.isNew,
      retried: true,
      usedHint: false
    });

    const diffHtml = giveUp ? '<span class="diff-char-err">（未输入）</span>' : renderStringDiff(userVal, expected);
    fb.innerHTML = `
      <div class="spell-diff-box">
        <div style="font-weight:700; color:var(--danger); margin-bottom:6px;">
          ${isExactMatch && task.usedHint ? '⚠️ 虽然拼对了，但借助了字母提示，已排入队尾稍后需独立盲默一次！' : '❌ 默写有误，已加入今日队尾循环强化！'}
        </div>
        ${!isExactMatch ? `<div style="font-family:'JetBrains Mono', monospace; font-size:15px; margin-bottom:6px;">你的输入：${diffHtml}</div>` : ''}
        <div style="font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--success); font-weight:700;">
          正确拼写：${escapeHtml(expected)}
        </div>
        ${item.note ? `<div style="font-size:12.5px; color:var(--ink-soft); margin-top:8px;">笔记/例句：${escapeHtml(item.note)}</div>` : ''}
      </div>
    `;
    actBar.innerHTML = `<button class="btn btn-danger" id="study-next-btn" onclick="nextStudyTask()">记住了，继续 (Enter)</button>`;
  }

  saveEntries();
  persistSession(studyCurrentIndex + 1);
  setTimeout(() => {
    const btn = document.getElementById('study-next-btn');
    if(btn) btn.focus();
  }, 40);
}

function nextStudyTask(){
  studyCurrentIndex++;
  renderStudyView();
}

function exitStudySession(){
  // 保存进度后退出：回来点"继续上次背词"即可接着背
  if(studyChecked){
    persistSession(studyCurrentIndex + 1);

    persistSession();
  }else{

  studyQueue = [];
  studyCurrentIndex = 0;

  render();
}

function renderStringDiff(input, target){
  let out = '';
  const maxLen = Math.max(input.length, target.length);
  for(let i = 0; i < maxLen; i++){
    const inChar = input[i];
    const tgtChar = target[i];
    if(inChar === undefined){
      out += `<span class="diff-char-missing">_</span>`;
    }else if(tgtChar === undefined){
      out += `<span class="diff-char-err">${escapeHtml(inChar)}</span>`;
    }else if(inChar.toLowerCase() === tgtChar.toLowerCase()){
      out += `<span class="diff-char-ok">${escapeHtml(inChar)}</span>`;
    }else{
      out += `<span class="diff-char-err">${escapeHtml(inChar)}</span>`;
    }
  }
  return out;
}

/* ============ WORDS & SENTENCES CRUD ============ */
function addEntry(mode, addToTodayPlan = false){
  let term, type, tag, translation, note;

  if (mode === 'word') {
    term = document.getElementById('word-term').value.trim();
    type = document.getElementById('word-type').value;
    tag = document.getElementById('word-tag').value.trim();
    translation = document.getElementById('word-translation').value.trim();
    note = document.getElementById('word-note').value.trim();
    if(!term){ document.getElementById('word-term').focus(); return; }
  } else {
    term = document.getElementById('sentence-term').value.trim();
    type = 'sentence';
    tag = document.getElementById('sentence-tag').value.trim();
    translation = document.getElementById('sentence-translation').value.trim();
    note = document.getElementById('sentence-note').value.trim();
    if(!term){ document.getElementById('sentence-term').focus(); return; }
  }

  entries.unshift({
    id: 'e' + Date.now(),
    term, type, tag, translation, note,
    createdAt: Date.now(),
    reviewLevel: 0,
    nextReview: 0,
    lastReviewed: 0,
    inTodayPlan: Boolean(addToTodayPlan),
    spellCount: 0,
    spellCorrect: 0
  });

  if (mode === 'word') {
    document.getElementById('word-term').value = '';
    document.getElementById('word-tag').value = '';
    document.getElementById('word-translation').value = '';
    document.getElementById('word-note').value = '';
    document.getElementById('word-term').focus();
  } else {
    document.getElementById('sentence-term').value = '';
    document.getElementById('sentence-tag').value = '';
    document.getElementById('sentence-translation').value = '';
    document.getElementById('sentence-note').value = '';
    document.getElementById('sentence-term').focus();
  }

  saveEntries();
  render();
}

function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function startEdit(id){ editingId = id; render(); }
function cancelEdit(){ editingId = null; render(); }

function saveEdit(id){
  const entry = entries.find(e => e.id === id);
  if (entry.type === 'sentence') {
    entry.term = document.getElementById('edit-sen-term-'+id).value.trim();
    entry.tag = document.getElementById('edit-sen-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-sen-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-sen-note-'+id).value.trim();
  } else {
    entry.term = document.getElementById('edit-word-term-'+id).value.trim();
    entry.type = document.getElementById('edit-word-type-'+id).value;
    entry.tag = document.getElementById('edit-word-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-word-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-word-note-'+id).value.trim();
  }
  editingId = null;
  saveEntries();
  render();
}

function updateFilters(){
  const wordsTagSelect = document.getElementById('filter-tag-words');
  const senTagSelect = document.getElementById('filter-tag-sentences');

  const wordTags = [...new Set(entries.filter(e => e.type !== 'sentence').map(e => e.tag).filter(Boolean))].sort();
  const senTags = [...new Set(entries.filter(e => e.type === 'sentence').map(e => e.tag).filter(Boolean))].sort();

  const currentWT = wordsTagSelect.value;
  wordsTagSelect.innerHTML = '<option value="">全部标签</option>' + wordTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(wordTags.includes(currentWT)) wordsTagSelect.value = currentWT;

  const currentST = senTagSelect.value;
  senTagSelect.innerHTML = '<option value="">全部标签</option>' + senTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(senTags.includes(currentST)) senTagSelect.value = currentST;
}

      return `
        <div class="entry editing type-sentence">
          <div class="form-grid-2">

            <div><label class="field-label">标签</label><input type="text" id="edit-sen-tag-${e.id}" value="${escapeHtml(e.tag)}"></div>
          </div>

          <div class="form-row-full"><label class="field-label">句型分析 / 笔记</label><textarea id="edit-sen-note-${e.id}">${escapeHtml(e.note)}</textarea></div>
          <div class="entry-actions">
            <button class="btn btn-sm" onclick="saveEdit('${e.id}')">保存</button>
            <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">取消</button>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="entry editing type-${e.type}">
          <div class="form-grid">
            <div><label class="field-label">单词 / 短语</label><input type="text" id="edit-word-term-${e.id}" value="${escapeHtml(e.term)}"></div>
            <div><label class="field-label">类型</label>
              <select id="edit-word-type-${e.id}">
                <option value="word" ${e.type==='word'?'selected':''}>单词 Word</option>
                <option value="phrase" ${e.type==='phrase'?'selected':''}>短语 Phrase</option>
              </select>
            </div>
            <div><label class="field-label">标签</label><input type="text" id="edit-word-tag-${e.id}" value="${escapeHtml(e.tag)}"></div>
          </div>
          <div class="form-row-full"><label class="field-label">中文意思 / 翻译</label><input type="text" id="edit-word-translation-${e.id}" value="${escapeHtml(e.translation)}"></div>
          <div class="form-row-full"><label class="field-label">笔记 / 例句</label><textarea id="edit-word-note-${e.id}">${escapeHtml(e.note)}</textarea></div>
          <div class="entry-actions">
            <button class="btn btn-sm" onclick="saveEdit('${e.id}')">保存</button>

          </div>
        </div>
      `;
    }
  }

  let statusBadgeHtml = '';
  let planButtonHtml = '';

  if(e.type !== 'sentence'){
    if(isNewWord(e)){
      statusBadgeHtml = `<span class="status-badge new">${e.inTodayPlan ? '📌 已选入今日新词' : '新词 New'}</span>`;
      planButtonHtml = `<button class="btn ${e.inTodayPlan ? 'btn-accent' : 'btn-ghost'} btn-sm" onclick="togglePlanWord('${e.id}')">${e.inTodayPlan ? '✓ 已选今日背' : '+ 选入今日背'}</button>`;
    } else if(isDueReviewWord(e)){
      statusBadgeHtml = `<span class="status-badge due">⏰ 今日待默写复习 (Lv.${e.reviewLevel})</span>`;
    } else {
      statusBadgeHtml = `<span class="status-badge learned">Lv.${e.reviewLevel} · 下次 ${formatDate(e.nextReview)}</span>`;
    }
  }

  return `
    <div class="entry type-${e.type} ${e.inTodayPlan && isNewWord(e) ? 'in-today-plan' : ''}">
      <div class="entry-term-row">
        <div class="entry-term">${escapeHtml(e.term)}</div>
        <button class="speak-btn" onclick="speakEntry('${e.id}', this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
      </div>
      <div class="entry-badges">

      ${e.translation ? `<div class="entry-translation">${escapeHtml(e.translation)}</div>` : ''}
      ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}

        <div class="entry-date">添加于 ${formatDate(e.createdAt)}${e.spellCount ? ` · 默写 ${e.spellCorrect}/${e.spellCount}` : ''}</div>
        <div class="entry-actions">
          ${planButtonHtml}
          <button class="btn btn-ghost btn-sm" onclick="startEdit('${e.id}')">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')">删除</button>
        </div>
      </div>
    </div>
  `;
}

function render(){
  updateFilters();
  updateBadges();
  document.getElementById('entry-count').textContent = `总共 ${entries.length} 项记录`;

  const searchW = document.getElementById('search-words').value.trim().toLowerCase();
  const statusFilterW = document.getElementById('filter-status-words').value;
  const typeFilterW = document.getElementById('filter-type-words').value;
  const tagFilterW = document.getElementById('filter-tag-words').value;
  const sortW = document.getElementById('sort-words').value;

  let wordsList = entries.filter(e => e.type !== 'sentence');
  wordsList = wordsList.filter(e => {
    if(statusFilterW === 'new' && !isNewWord(e)) return false;
    if(statusFilterW === 'plan' && !(isNewWord(e) && e.inTodayPlan)) return false;
    if(statusFilterW === 'due' && !isDueReviewWord(e)) return false;
    if(statusFilterW === 'learned' && isNewWord(e)) return false;
    if(typeFilterW && e.type !== typeFilterW) return false;
    if(tagFilterW && e.tag !== tagFilterW) return false;
    if(searchW && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchW)) return false;
    return true;
  });
  wordsList.sort((a,b) => sortW === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  const wordsContainer = document.getElementById('words-entries');
  if(entries.filter(e => e.type !== 'sentence').length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">还没有单词记录 — 在上方添加你的第一个单词或短语吧</div>';
  } else if(wordsList.length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">没有符合筛选条件的单词记录</div>';
  } else {
    wordsContainer.innerHTML = wordsList.map(generateEntryHTML).join('');
  }

  const searchS = document.getElementById('search-sentences').value.trim().toLowerCase();
  const tagFilterS = document.getElementById('filter-tag-sentences').value;
  const sortS = document.getElementById('sort-sentences').value;

  let senList = entries.filter(e => e.type === 'sentence');
  senList = senList.filter(e => {
    if(tagFilterS && e.tag !== tagFilterS) return false;
    if(searchS && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchS)) return false;
    return true;
  });
  senList.sort((a,b) => sortS === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  const senContainer = document.getElementById('sentences-entries');
  if(entries.filter(e => e.type === 'sentence').length === 0){
    senContainer.innerHTML = '<div class="empty-msg">还没有长句记录 — 在上方记录你在阅读中遇到的好句子吧</div>';
  } else if(senList.length === 0){
    senContainer.innerHTML = '<div class="empty-msg">没有符合条件的长句记录</div>';
  } else {
    senContainer.innerHTML = senList.map(generateEntryHTML).join('');
  }
}

/* ============ ROOT NOTES ============ */
function addRootGroup(){
  const term = document.getElementById('root-term').value.trim();
  const meaning = document.getElementById('root-meaning').value.trim();
  const firstWord = document.getElementById('root-first-word').value.trim();
  const firstMeaning = document.getElementById('root-first-meaning').value.trim();
  if(!term){ document.getElementById('root-term').focus(); return; }

  const words = [];
  if(firstWord) words.push({ id: 'rw' + Date.now(), word: firstWord, meaning: firstMeaning, children: [] });

  roots.unshift({ id: 'r' + Date.now(), root: term, meaning: meaning, words: words, createdAt: Date.now() });

  document.getElementById('root-term').value = '';
  document.getElementById('root-meaning').value = '';
  document.getElementById('root-first-word').value = '';
  document.getElementById('root-first-meaning').value = '';
  saveRoots();
  renderRoots();
}

function findWordNode(nodes, nodeId){
  for(const n of nodes){
    if(n.id === nodeId) return n;
    if(n.children && n.children.length){
      const found = findWordNode(n.children, nodeId);
      if(found) return found;
    }
  }
  return null;
}

function removeWordNode(nodes, nodeId){
  const idx = nodes.findIndex(n => n.id === nodeId);
  if(idx !== -1){ nodes.splice(idx, 1); return true; }
  for(const n of nodes){
    if(n.children && n.children.length && removeWordNode(n.children, nodeId)) return true;
  }
  return false;
}

function addWordToRoot(rootId){
  const wordInput = document.getElementById('add-word-' + rootId);
  const meaningInput = document.getElementById('add-word-meaning-' + rootId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  r.words.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();
}

function toggleChildForm(nodeId){
  const form = document.getElementById('child-form-' + nodeId);
  if(!form) return;
  const isOpen = form.classList.toggle('open');
  if(isOpen){
    const input = document.getElementById('child-word-' + nodeId);
    if(input) input.focus();
  }
}

function addChildWord(rootId, parentNodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const parent = findWordNode(r.words, parentNodeId);
  if(!parent) return;
  const wordInput = document.getElementById('child-word-' + parentNodeId);
  const meaningInput = document.getElementById('child-meaning-' + parentNodeId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }
  if(!Array.isArray(parent.children)) parent.children = [];
  parent.children.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();
}

function startEditWordNode(nodeId){ editingRootNodeId = nodeId; renderRoots(); }
function cancelEditWordNode(){ editingRootNodeId = null; renderRoots(); }

function saveEditWordNode(rootId, nodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const node = findWordNode(r.words, nodeId);
  if(!node) return;
  const newWord = document.getElementById('edit-node-word-' + nodeId).value.trim();
  const newMeaning = document.getElementById('edit-node-meaning-' + nodeId).value.trim();
  if(!newWord){ document.getElementById('edit-node-word-' + nodeId).focus(); return; }
  node.word = newWord;
  node.meaning = newMeaning;
  editingRootNodeId = null;
  saveRoots();
  renderRoots();
}

function deleteWordNode(rootId, nodeId){
  if(!confirm('确定要删除这个词吗？这也会删除它的所有下级派生词。')) return;
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  removeWordNode(r.words, nodeId);
  saveRoots();
  renderRoots();
}

function deleteRoot(rootId){
  if(!confirm('确定要删除这个词根笔记吗？')) return;
  roots = roots.filter(r => r.id !== rootId);
  saveRoots();
  renderRoots();
}

function editRootMeta(rootId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const newRoot = prompt('词根：', r.root);
  if(newRoot === null) return;
  const newMeaning = prompt('词根含义：', r.meaning || '');
  if(newMeaning === null) return;
  r.root = newRoot.trim() || r.root;
  r.meaning = newMeaning.trim();
  saveRoots();
  renderRoots();
}

function nodeMatchesSearch(nodes, search){
  return nodes.some(n =>
    n.word.toLowerCase().includes(search) ||
    (n.meaning && n.meaning.toLowerCase().includes(search)) ||
    (n.children && n.children.length && nodeMatchesSearch(n.children, search))
  );
}

function renderRoots(){
  const container = document.getElementById('roots-list');
  if(!container) return;
  const searchEl = document.getElementById('search-roots');
  const sortEl = document.getElementById('sort-roots');
  const search = (searchEl ? searchEl.value : '').trim().toLowerCase();
  const sort = sortEl ? sortEl.value : 'new';

  let list = roots.slice();
  if(search){
    list = list.filter(r =>
      r.root.toLowerCase().includes(search) ||
      (r.meaning && r.meaning.toLowerCase().includes(search)) ||
      nodeMatchesSearch(r.words, search)
    );
  }
  list.sort((a,b) => sort === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  if(list.length === 0){
    container.innerHTML = `<div class="empty-msg">${roots.length === 0 ? '还没有词根笔记 — 在上方创建第一个吧' : '没有找到匹配的词根笔记'}</div>`;
    return;
  }
  container.innerHTML = list.map(renderRootCard).join('');
}

function renderWordTree(nodes, rootId, depth){
  if(!nodes || nodes.length === 0) return '';
  return `
    <div class="root-stem-down"></div>
    <div class="root-branches-wrap">
      <div class="root-branches">
        ${nodes.map(n => renderWordBranch(n, rootId, depth)).join('')}
      </div>
    </div>
  `;
}

function renderWordBranch(node, rootId, depth){
  const children = Array.isArray(node.children) ? node.children : [];
  if (node.id === editingRootNodeId) {
    return `
      <div class="root-word-branch" data-depth="${depth}">
        <div class="root-word-node" style="padding: 12px 10px;">
          <input type="text" id="edit-node-word-${node.id}" value="${escapeHtml(node.word)}" style="width: 100%; margin-bottom: 6px; font-size: 13px; padding: 5px 8px; text-align: center;">
          <input type="text" id="edit-node-meaning-${node.id}" value="${escapeHtml(node.meaning || '')}" placeholder="意思" style="width: 100%; margin-bottom: 10px; font-size: 12px; padding: 5px 8px; text-align: center;">
          <div style="display: flex; gap: 6px; justify-content: center;">
            <button class="btn btn-success" style="padding: 4px 10px; font-size: 11px;" onclick="saveEditWordNode('${rootId}', '${node.id}')">保存</button>
            <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 11px;" onclick="cancelEditWordNode()">取消</button>
          </div>
        </div>
        ${renderWordTree(children, rootId, depth + 1)}
      </div>
    `;
  }

  return `
    <div class="root-word-branch" data-depth="${depth}">
      <div class="root-word-node">
        <div class="root-word-actions">
          <button class="root-word-action-btn" onclick="startEditWordNode('${node.id}')" title="编辑">✎</button>
          <button class="root-word-action-btn" onclick="deleteWordNode('${rootId}','${node.id}')" title="删除">×</button>
        </div>
        <div class="root-word-row">
          <span class="root-word-text">${escapeHtml(node.word)}</span>
          <button class="speak-btn" style="width:20px;height:20px;font-size:11px;" onclick="speakText(this.closest('.root-word-node').querySelector('.root-word-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
        </div>
        ${node.meaning ? `<div class="root-word-meaning">${escapeHtml(node.meaning)}</div>` : ''}
        <button class="root-word-add-child" onclick="toggleChildForm('${node.id}')">+ 派生词</button>
      </div>
      <div class="child-add-form" id="child-form-${node.id}">
        <input type="text" id="child-word-${node.id}" placeholder="派生词">
        <input type="text" id="child-meaning-${node.id}" placeholder="意思">
        <button class="btn btn-sm" onclick="addChildWord('${rootId}','${node.id}')">添加</button>
      </div>
      ${renderWordTree(children, rootId, depth + 1)}
    </div>
  `;
}

function renderRootCard(r){
  return `
  <div class="root-card">
    <div class="root-card-actions">
      <button class="btn btn-ghost btn-sm" onclick="editRootMeta('${r.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRoot('${r.id}')">删除</button>
    </div>
    <div class="root-node-wrap">
      <div class="root-node">
        <span class="root-node-text">${escapeHtml(r.root)}</span>
        ${r.meaning ? `<span class="root-node-meaning">${escapeHtml(r.meaning)}</span>` : ''}
        <button class="speak-btn" onclick="speakText(this.closest('.root-node').querySelector('.root-node-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
      </div>
    </div>
    ${r.words.length ? renderWordTree(r.words, r.id, 1) : `<div style="text-align:center;color:var(--ink-soft);font-size:13px;padding:16px 0 4px;">还没有派生词，在下方添加第一个吧</div>`}
    <div class="root-add-word-row">
      <input type="text" id="add-word-${r.id}" placeholder="派生词，e.g. respect">
      <input type="text" id="add-word-meaning-${r.id}" placeholder="意思">
      <button class="btn btn-sm" onclick="addWordToRoot('${r.id}')">+ 添加</button>
    </div>
  </div>
  `;
}

/* ============ NOTES APP ============ */
function createNewNote() {
  const newNote = { id: 'n' + Date.now(), title: '新笔记', content: '', updatedAt: Date.now() };
  notes.unshift(newNote);
  activeNoteId = newNote.id;
  saveNotes();
  renderNotesList();
  renderNoteEditor();
}

function selectNote(id) { activeNoteId = id; renderNotesList(); renderNoteEditor(); }

function deleteNote(id) {
  if(!confirm('确定要删除这篇笔记吗？')) return;
  notes = notes.filter(n => n.id !== id);
  if(activeNoteId === id) activeNoteId = notes.length > 0 ? notes[0].id : null;
  saveNotes();
  renderNotesList();
  renderNoteEditor();
}

function updateActiveNote() {
  if(!activeNoteId) return;
  const note = notes.find(n => n.id === activeNoteId);
  if(note) {
    note.title = document.getElementById('note-title').value;
    note.content = document.getElementById('note-content').value;
    note.updatedAt = Date.now();
    saveNotes();
    renderNotesList();
  }
}

function getNoteSnippet(content) {
  if(!content) return '无额外文本';
  const text = content.replace(/\n/g, ' ').trim();
  return text.length > 20 ? text.substring(0, 20) + '...' : text;
}

function formatNoteDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  return String(d.getMonth()+1) + '/' + String(d.getDate());
}

function renderNotesList() {
  const container = document.getElementById('notes-list');
  if(!container) return;
  if (notes.length === 0) {
    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 13px;">点击上方 + 创建新笔记</div>';
    return;
  }
  const sortedNotes = [...notes].sort((a,b) => b.updatedAt - a.updatedAt);
  container.innerHTML = sortedNotes.map(n => `
    <div class="note-item ${n.id === activeNoteId ? 'active' : ''}" onclick="selectNote('${n.id}')">
      <div class="note-item-title">${escapeHtml(n.title) || '无标题'}</div>
      <div class="note-item-meta">
        <span class="note-item-date">${formatNoteDate(n.updatedAt)}</span>
        <span class="note-item-snippet">${escapeHtml(getNoteSnippet(n.content))}</span>
      </div>
    </div>
  `).join('');
}

function renderNoteEditor() {
  const editor = document.getElementById('notes-editor');
  if(!editor) return;
  if(!activeNoteId) {
    editor.innerHTML = '<div class="note-empty-state">请选择或创建一篇笔记</div>';
    return;
  }
  const note = notes.find(n => n.id === activeNoteId);
  if(!note) return;
  editor.innerHTML = `
    <div class="notes-editor-toolbar">
      <button class="btn btn-ghost btn-sm" onclick="deleteNote('${note.id}')" title="删除笔记">🗑️</button>
    </div>
    <div class="notes-editor-content">
      <input type="text" id="note-title" class="note-title-input" value="${escapeHtml(note.title)}" placeholder="无标题" oninput="updateActiveNote()">
      <textarea id="note-content" class="note-content-textarea" placeholder="在这里输入笔记内容..." oninput="updateActiveNote()">${escapeHtml(note.content)}</textarea>
    </div>
  `;
}

/* ============ TTS & HELPERS ============ */
if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function speak(text, lang = 'en-US'){
  if(!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9;
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    let bestVoice =
      voices.find(v => v.lang.startsWith('en') && v.name.includes('Natural')) ||
      voices.find(v => v.lang === 'en-US' && v.name.includes('Google US English')) ||
      voices.find(v => v.name === 'Samantha' || v.name === 'Alex' || v.name === 'Daniel') ||
      voices.find(v => v.lang === 'en-US');
    if (bestVoice) utter.voice = bestVoice;
  }
  speechSynthesis.speak(utter);
}

function speakEntry(id, btn){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  flashSpeakBtn(btn);
  speak(e.term, 'en-US');
}

function speakText(text, btn){
  flashSpeakBtn(btn);
  speak(text, 'en-US');
}

function flashSpeakBtn(btn){
  if(!btn) return;
  btn.classList.add('speaking');
  setTimeout(() => btn.classList.remove('speaking'), 400);
}

function typeLabel(type){
  if(type === 'word') return '单词';
  if(type === 'phrase') return '短语';
  if(type === 'sentence') return '句子';
  return type;
}

function formatDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============ EXPORT / IMPORT ============ */
function exportData(){
  const payload = { entries, roots, notes, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `vocab-notebook-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const importedEntries = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.entries) ? parsed.entries : null);
      const importedRoots = Array.isArray(parsed) ? [] : (Array.isArray(parsed.roots) ? parsed.roots : []);
      const importedNotes = Array.isArray(parsed) ? [] : (Array.isArray(parsed.notes) ? parsed.notes : []);

      if(!importedEntries) throw new Error('Invalid format');

      if(confirm(`导入记录：单词/长句(${importedEntries.length}), 词根(${importedRoots.length}), 笔记(${importedNotes.length})\n\n点"确定"合并到现有数据，点"取消"覆盖现有数据。`)){
        const existingIds = new Set(entries.map(en => en.id));
        importedEntries.forEach(im => { if(!existingIds.has(im.id)) entries.unshift(im); });
        const existingRootIds = new Set(roots.map(r => r.id));
        importedRoots.forEach(im => { if(!existingRootIds.has(im.id)) roots.unshift(im); });
        const existingNoteIds = new Set(notes.map(n => n.id));
        importedNotes.forEach(im => { if(!existingNoteIds.has(im.id)) notes.unshift(im); });
      }else{
        entries = importedEntries;
        roots = importedRoots;
        notes = importedNotes;
      }

      // 1. 补全导入数据的默认字段
      entries.forEach(item => {
        if(typeof item.reviewLevel !== 'number') item.reviewLevel = 0;
        if(typeof item.lastReviewed !== 'number') item.lastReviewed = 0;
        if(typeof item.nextReview !== 'number') item.nextReview = 0;
        if(typeof item.inTodayPlan !== 'boolean') item.inTodayPlan = false;
        if(typeof item.spellCount !== 'number') item.spellCount = 0;
        if(typeof item.spellCorrect !== 'number') item.spellCorrect = 0;
      });
      normalizeRoots(roots);
      if(notes.length > 0 && !notes.find(n => n.id === activeNoteId)) {
        activeNoteId = notes[0].id;
      }

      // 2. 先保存到 localStorage（切勿在此之前调用 loadEntries）
      saveEntries(); 
      saveRoots(); 
      saveNotes();

      // 3. 重新渲染所有界面
      render(); 
      renderStudyView(); 
      renderRoots(); 
      renderNotesList(); 
      renderNoteEditor();

      alert(`成功导入 ${importedEntries.length} 条记录！`);
    }catch(err){ 
      console.error(err);
      alert('导入失败：文件格式不正确'); 
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}
/* ============ INIT ============ */
document.getElementById('word-term').addEventListener('keydown', function(e){
  if(e.key === 'Enter') addEntry('word', false);
});
document.getElementById('sentence-term').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addEntry('sentence', false);
});

loadEntries();
loadRoots();
loadNotes();
</script>
