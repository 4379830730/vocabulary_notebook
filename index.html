<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vocabulary Notebook</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

:root{
  --paper:#F5F5F7;
  --ink:#1D1D1F;
  --ink-soft:#6E6E73;
  --accent:#FF6B4A;
  --accent-blue:#0A84FF;
  --accent-purple:#8B5CF6;
  --grid:#E6E6EA;
  --success:#30B265;
  --warn:#FFB020;
  --danger:#FF453A;
  --muted:#AEAEB4;
  --card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lift:0 10px 30px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --r-pill:999px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Open Sans', 'PingFang SC', 'Helvetica Neue', sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  line-height:1.55;
  padding:0 0 80px;
  -webkit-font-smoothing:antialiased;
}

/* ---- Top bar (frosted glass) ---- */
.filebar{
  background:rgba(29,29,31,0.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  color:rgba(255,255,255,0.92);
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-family:-apple-system, BlinkMacSystemFont, 'Open Sans', sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.filebar .tag{
  background:var(--accent);
  color:#fff;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:600;
  font-size:11px;
  letter-spacing:0.02em;
  margin-left:8px;
}
.filebar .count{font-family:inherit; color:rgba(255,255,255,0.6); font-weight:500;}
.filebar .due-badge{
  background:var(--warn);
  color:#1D1D1F;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-weight:700;
  font-size:11px;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:36px 24px 0;
}

/* ---- Tabs: segmented control ---- */
.tabs{
  display:inline-flex;
  gap:2px;
  margin-bottom:28px;
  border:none;
  background:rgba(120,120,128,0.12);
  padding:4px;
  border-radius:var(--r-pill);
  flex-wrap:wrap;
  justify-content: center;
}
.tab-btn{
  font-family:inherit;
  font-size:13px;
  letter-spacing:0.01em;
  text-transform:none;
  background:none;
  border:none;
  padding:8px 18px;
  margin-right:0;
  cursor:pointer;
  color:var(--ink-soft);
  border-bottom:none;
  border-radius:var(--r-pill);
  position:relative;
  top:0;
  font-weight:500;
  transition:background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.tab-btn.active{
  color:var(--ink);
  background:#fff;
  box-shadow:var(--shadow-sm);
  font-weight:600;
}
.tab-btn .badge{
  background:var(--accent);
  color:#fff;
  border-radius:var(--r-pill);
  padding:1px 7px;
  font-size:10px;
  margin-left:6px;
  font-weight:700;
}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ---- Add form / frames (Added margin: 0 auto for centering) ---- */
.add-frame, .session-frame{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
  padding:26px 28px;
  margin: 0 auto 24px auto; /* 居中显示 */
  max-width:880px;
}
.corner{display:none;}

.frame-label{
  font-family:inherit;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-grid-2{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
.form-row-full{margin-bottom:14px;}

label.field-label{
  display:block;
  font-family:inherit;
  font-size:11px;
  letter-spacing:0.03em;
  text-transform:none;
  color:var(--ink-soft);
  font-weight:600;
  margin-bottom:6px;
}

input[type="text"], textarea, select{
  width:100%;
  border:1px solid var(--grid);
  border-radius:var(--r-sm);
  padding:10px 13px;
  font-family:inherit;
  font-size:14px;
  color:var(--ink);
  background:#FAFAFB;
  transition:border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
input[type="text"]:focus, textarea:focus, select:focus{
  outline:none;
  border-color:var(--accent);
  background:#fff;
  box-shadow:0 0 0 4px rgba(255,107,74,0.12);
}
textarea{resize:vertical;min-height:54px;}

.sentence-textarea {
  min-height: 80px;
  font-size: 15px;
}

.btn{
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.01em;
  border:none;
  border-radius:var(--r-pill);
  padding:10px 20px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  transition:opacity 0.15s ease, transform 0.1s ease;
}
.btn:hover{opacity:0.85;}
.btn:active{transform:scale(0.97);}
.btn-ghost{
  background:rgba(120,120,128,0.12);
  color:var(--ink-soft);
  border:none;
}
.btn-ghost:hover{background:rgba(120,120,128,0.2);color:var(--ink);opacity:1;}
.btn-danger{
  background:rgba(255,69,58,0.1);
  color:var(--danger);
  border:none;
}
.btn-danger:hover{background:var(--danger);color:#fff;opacity:1;}
.btn-success{
  background:var(--success);
  border:none;
  color:#fff;
}
.btn-warn{
  background:rgba(255,176,32,0.14);
  border:none;
  color:#B9781A;
}
.btn-warn:hover{background:var(--warn);color:#fff;opacity:1;}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-icon{padding:6px 10px; font-size:14px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
  align-items:center;
  max-width:880px;
  margin-left:auto;
  margin-right:auto;
}
.toolbar input[type="text"]{flex:1;min-width:160px;}
.toolbar select{width:auto;min-width:110px;}
.empty-msg{
  text-align:center;
  color:var(--muted);
  font-family:inherit;
  font-size:13px;
  padding:48px 20px;
  border:1.5px dashed var(--grid);
  border-radius:var(--r-lg);
  background:rgba(120,120,128,0.04);
}

/* ---- Entry grid (card layout) ---- */
#words-entries, #sentences-entries{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
  align-items:stretch;
}
#words-entries .empty-msg, #sentences-entries .empty-msg{
  grid-column:1 / -1;
}
@media (max-width:1080px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(3, 1fr);}
}
@media (max-width:800px){
  #words-entries, #sentences-entries{grid-template-columns:repeat(2, 1fr);}
}
@media (max-width:520px){
  #words-entries, #sentences-entries{grid-template-columns:1fr;}
}

/* ---- Entry cards ---- */
.entry{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-left:none;
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  padding:16px 18px;
  margin-bottom:0;
  display:flex;
  flex-direction:column;
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.entry:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.entry.type-phrase{border-top:3px solid var(--success);}
.entry.type-word{border-top:3px solid var(--accent);}
.entry.type-sentence{border-top:3px solid var(--accent-blue);}
.entry.editing{grid-column:1 / -1;}

.entry-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:6px;
}
.entry-term{
  font-family:inherit;
  font-weight:700;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height: 1.4;
  flex: 1;
}
.entry-meta{
  display:flex;
  gap:6px;
  align-items:flex-start;
  flex-wrap:wrap;
  flex: 1;
}
.type-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.03em;
  text-transform:none;
  border:none;
  background:rgba(120,120,128,0.12);
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--ink-soft);
  margin-top: 2px;
  font-weight:600;
}
.tag-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.02em;
  background:rgba(10,132,255,0.1);
  border:none;
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--accent-blue);
  margin-top: 2px;
  font-weight:600;
}
.level-badge{
  font-family:inherit;
  font-size:10px;
  letter-spacing:0.02em;
  border-radius:var(--r-pill);
  padding:3px 9px;
  color:var(--ink-soft);
  border:none;
  background:rgba(120,120,128,0.12);
  margin-top: 2px;
  font-weight:600;
}
.entry-translation{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-bottom:4px;
  white-space:pre-wrap;
}
.entry-note{
  font-size:13px;
  color:var(--ink);
  background:rgba(120,120,128,0.06);
  border-radius:var(--r-sm);
  padding:10px 12px;
  margin-top:8px;
  white-space:pre-wrap;
}
.entry-date{
  font-family:inherit;
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}
.entry-badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:8px;
}
.entry-footer{
  margin-top:auto;
  padding-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.entry-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ---- Speak button ---- */
.speak-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  background:rgba(120,120,128,0.12);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  line-height:1;
  padding:0;
  margin-left:2px;
  transition:background 0.15s, color 0.15s, transform 0.1s;
}
.speak-btn:hover{background:var(--ink);color:#fff;}
.speak-btn:active{transform:scale(0.9);}
.speak-btn.speaking{background:var(--accent);color:#fff;}
.speak-icon{
  width:14px;
  height:14px;
  object-fit:contain;
  display:block;
  pointer-events:none;
}
.root-word-node .speak-btn .speak-icon{width:11px;height:11px;}
.entry-term-row{display:flex;align-items:flex-start;gap:6px;}
.fc-term-row{display:flex;align-items:center;justify-content:center;gap:8px;}
.quiz-question-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}

/* ============ ROOT NOTES (soft rounded tree diagram) ============ */

#roots-list{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.root-card{
  position:relative;
  background:var(--card);
  border:1px solid rgba(0,0,0,0.04);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
  padding:26px 24px 22px;
}
.root-card-actions{
  position:absolute;
  top:18px;
  right:20px;
  display:flex;
  gap:6px;
}
.root-node-wrap{
  display:flex;
  justify-content:center;
}
.root-node{
  display:flex;
  align-items:baseline;
  gap:10px;
  background:var(--ink);
  color:#fff;
  padding:12px 26px;
  border-radius:var(--r-pill);
  position:relative;
  z-index:2;
  box-shadow:var(--shadow-sm);
}
.root-node-text{
  font-family:inherit;
  font-weight:800;
  font-size:18px;
  letter-spacing:0.01em;
}
.root-node-meaning{
  font-size:13px;
  opacity:0.85;
}
.root-node .speak-btn{
  background:rgba(255,255,255,0.15);
  color:#fff;
}
.root-node .speak-btn:hover{background:#fff;color:var(--ink);}
.root-stem-down{
  width:2px;
  height:22px;
  background:var(--grid);
  margin:0 auto;
}
.root-branches-wrap{
  position:relative;
  padding-top:22px;
}
.root-branches-wrap::before{
  content:'';
  position:absolute;
  top:0;
  left:10%;
  right:10%;
  height:2px;
  background:var(--grid);
}
.root-branches{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:18px 16px;
  position:relative;
}
.root-word-branch{
  position:relative;
  padding-top:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.root-word-branch::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  width:2px;
  height:22px;
  background:var(--grid);
  transform:translateX(-50%);
}
.root-word-node{
  position:relative;
  width:152px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.04);
  border-top:3px solid var(--success);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);
  padding:11px 12px 10px;
  text-align:center;
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.root-word-node:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.root-word-branch[data-depth="2"] .root-word-node{border-top-color:var(--accent-blue);}
.root-word-branch[data-depth="3"] .root-word-node{border-top-color:var(--accent);}
.root-word-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.root-word-text{
  font-family:inherit;
  font-weight:700;
  font-size:14px;
  word-break:break-word;
}
.root-word-meaning{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:4px;
  word-break:break-word;
}

/* 编辑与删除按钮样式 */
.root-word-actions{
  position:absolute;
  top:-8px;
  right:-8px;
  display:flex;
  gap:4px;
  opacity:0;
  transition:opacity 0.15s;
}
.root-word-node:hover .root-word-actions{opacity:1;}
.root-word-action-btn{
  width:20px;
  height:20px;
  border-radius:50%;
  border:none;
  background:#fff;
  color:var(--ink-soft);
  font-size:11px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}
.root-word-action-btn:hover{background:var(--accent);color:#fff;}

.root-word-add-child{
  margin-top:7px;
  width:100%;
  font-size:10.5px;
  padding:4px 6px;
  border:1px dashed var(--grid);
  background:transparent;
  color:var(--ink-soft);
  border-radius:var(--r-pill);
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
}
.root-word-add-child:hover{border-color:var(--accent);color:var(--accent);}
.child-add-form{
  display:none;
  flex-direction:column;
  gap:6px;
  width:152px;
  margin-top:9px;
  padding-top:9px;
  border-top:1px dashed var(--grid);
}
.child-add-form.open{display:flex;}
.child-add-form input{
  font-size:12px;
  padding:6px 8px;
}
.child-add-form .btn{align-self:flex-end;}
.root-empty-hint{
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
  padding:16px 0 4px;
}
.root-add-word-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
  padding-top:16px;
  border-top:1px dashed var(--grid);
}
.root-add-word-row input{
  flex:1;
  min-width:110px;
}

/* ---- Apple Notes Layout (Rich Text Upgrade) ---- */
.notes-container {
  display: flex;
  height: 650px;
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.04);
  margin: 0 auto 24px auto;
  max-width: 1000px;
}
.notes-sidebar {
  width: 280px;
  border-right: 1px solid var(--grid);
  display: flex;
  flex-direction: column;
  background: rgba(245,245,247,0.5);
  flex-shrink: 0;
}
.notes-sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--grid);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.notes-sidebar-title {
  font-weight: 700;
  font-size: 14px;
}
.notes-list {
  flex: 1;
  overflow-y: auto;
}
.note-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--grid);
  cursor: pointer;
  transition: background 0.15s ease;
}
.note-item:hover {
  background: rgba(0,0,0,0.03);
}
.note-item.active {
  background: var(--accent-blue);
  color: #fff;
  border-bottom-color: transparent;
}
.note-item-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-item.active .note-item-title {
  color: #fff;
}
.note-item-meta {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-item.active .note-item-meta {
  color: rgba(255,255,255,0.8);
}
.note-item-date {
  font-weight: 600;
  flex-shrink: 0;
}
.note-item-snippet {
  opacity: 0.8;
  overflow: hidden;
  text-overflow: ellipsis;
}
.notes-editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #fff;
}
.notes-editor-toolbar {
  padding: 12px 24px;
  background: #fafafa;
  border-bottom: 1px solid var(--grid);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rt-tools {
  display: flex;
  gap: 8px;
  align-items: center;
}
.rt-select {
  padding: 4px 8px;
  font-size: 13px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  outline: none;
  background: #fff;
}
.notes-editor-content-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 40px 40px 40px;
  overflow-y: auto;
}
.note-title-input {
  border: none !important;
  box-shadow: none !important;
  font-size: 24px !important;
  font-weight: 700 !important;
  padding: 16px 0 10px 0 !important;
  margin-bottom: 10px;
  background: transparent !important;
  color: var(--ink) !important;
}

/* 富文本编辑区样式 */
.note-content-editor {
  flex: 1;
  outline: none;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  min-height: 200px;
}
.note-content-editor[placeholder]:empty:before {
  content: attr(placeholder);
  color: var(--muted);
  pointer-events: none;
  display: block;
}
/* 编辑器里的图片样式 */
.note-content-editor img {
  max-width: 100%;
  border-radius: 8px;
  margin: 10px 0;
  display: block;
  box-shadow: var(--shadow-sm);
}

.note-empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
  background: #fff;
}

/* ---- Review session ---- */

<script>
let entries = [];
let editingId = null;
let roots = [];
let editingRootNodeId = null;
let notes = [];
let activeNoteId = null;

const STORAGE_KEY = 'vocab-notebook-entries';
const ROOTS_KEY = 'vocab-notebook-roots';
const NOTES_KEY = 'vocab-notebook-notes';
const DAY = 24*60*60*1000;
const LEVEL_INTERVALS = [1,1,2,4,7,15,30];

/* ============ STORAGE ============ */

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      entries = JSON.parse(raw);
    }
  }catch(e){
    entries = [];
  }
  entries.forEach(e => {
    if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
    if(typeof e.nextReview !== 'number') e.nextReview = Date.now();
    if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
  });
  render();
  renderReview();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Save failed', e);
  }
  updateDueBadge();
}

/* ---- Roots storage ---- */

function loadRoots(){
  try{
    const raw = localStorage.getItem(ROOTS_KEY);
    if(raw) roots = JSON.parse(raw);
  }catch(e){
    roots = [];
  }
  normalizeRoots(roots);
  renderRoots();
}

function normalizeRoots(rootList){
  rootList.forEach(r => {
    if(!Array.isArray(r.words)) r.words = [];
    if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
    if(typeof r.reviewLevel !== 'number') r.reviewLevel = 0;
    if(typeof r.nextReview !== 'number') r.nextReview = Date.now();
    if(typeof r.lastReviewed !== 'number') r.lastReviewed = 0;
    normalizeWordNodes(r.words);
  });
}
function normalizeWordNodes(nodes){
  nodes.forEach(n => {
    if(!Array.isArray(n.children)) n.children = [];
    normalizeWordNodes(n.children);
  });
}

function saveRoots(){
  try{
    localStorage.setItem(ROOTS_KEY, JSON.stringify(roots));
  }catch(e){
    console.error('Save failed', e);
  }
}

/* ---- Notes Storage ---- */
function loadNotes() {
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    if(raw) notes = JSON.parse(raw);
  } catch(e) {
    notes = [];
  }
  if (notes.length > 0) {
    activeNoteId = notes[0].id;
  }
  renderNotesList();
  renderNoteEditor();
}

function saveNotes() {
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  } catch(e) {
    console.error('Save failed', e);
  }
}

/* ============ TABS ============ */

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if(tab === 'review') renderReview();
  if(tab === 'quiz') renderQuizSetup();
  if(tab === 'roots') renderRoots();
  if(tab === 'notes') {
    renderNotesList();
    renderNoteEditor();
  }
}

function updateDueBadge(){
  const due = entries.filter(e => (e.translation || e.note) && e.nextReview <= Date.now()).length + dueRoots().length;
  const filebarBadge = document.getElementById('due-badge');
  const tabBadge = document.getElementById('review-tab-badge');
  if(due > 0){
    filebarBadge.style.display = 'inline-block';
    filebarBadge.textContent = `${due} due today`;
    tabBadge.style.display = 'inline-block';
    tabBadge.textContent = due;
  }else{
    filebarBadge.style.display = 'none';
    tabBadge.style.display = 'none';
  }
}

/* ============ RICH TEXT EDITOR TOOLS ============ */

// 格式化文本函数
function formatDoc(cmd, value = null) {
  document.execCommand(cmd, false, value);
  const editor = document.getElementById('note-content');
  if (editor) editor.focus();
  updateActiveNote();
}

// 插入图片带自动压缩（防崩溃机制）
function insertImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // 创建 Canvas 压缩图像，防止 localStorage 超过 5MB 爆满
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      let width = img.width;
      let height = img.height;

      // 按比例缩小
      if (width > MAX_WIDTH) {
        height *= MAX_WIDTH / width;
        width = MAX_WIDTH;
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // 导出为体积较小的 JPEG 格式，画质 80%
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
      
      // 插入到富文本框中
      document.execCommand('insertImage', false, compressedDataUrl);
      updateActiveNote();
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
  event.target.value = ''; // 清空 input 以便下次能选同一张图
}

/* ============ NOTES APP ============ */

function createNewNote() {
  const newNote = {
    id: 'n' + Date.now(),
    title: '新笔记',
    content: '',
    updatedAt: Date.now()
  };
  notes.unshift(newNote);
  activeNoteId = newNote.id;
  saveNotes();
  renderNotesList();
  renderNoteEditor();
  setTimeout(() => {
    const titleInput = document.getElementById('note-title');
    if(titleInput) {
      titleInput.focus();
      titleInput.select();
    }
  }, 50);
}

function selectNote(id) {
  activeNoteId = id;
  renderNotesList();
  renderNoteEditor();
}

function deleteNote(id) {
  if(!confirm('确定要删除这篇笔记吗？')) return;
  notes = notes.filter(n => n.id !== id);
  if(activeNoteId === id) {
    activeNoteId = notes.length > 0 ? notes[0].id : null;
  }
  saveNotes();
  renderNotesList();
  renderNoteEditor();
}

function updateActiveNote() {
  if(!activeNoteId) return;
  const note = notes.find(n => n.id === activeNoteId);
  if(note) {
    note.title = document.getElementById('note-title').value;
    // 抓取富文本框的 HTML 内容，而不是纯文本
    note.content = document.getElementById('note-content').innerHTML;
    note.updatedAt = Date.now();
    saveNotes();
    renderNotesList(); // 只更新左侧列表，不重绘右侧以免丢失光标
  }
}

function getNoteSnippet(htmlContent) {
  if(!htmlContent) return '无额外内容';
  
  // 利用临时 DOM 元素剥离掉 HTML 标签和图片，只提取纯文本做预览
  const temp = document.createElement('div');
  temp.innerHTML = htmlContent;
  const text = temp.textContent || temp.innerText || '';
  
  const cleanText = text.replace(/\n/g, ' ').trim();
  return cleanText.length > 20 ? cleanText.substring(0, 20) + '...' : (cleanText || '无额外内容');
}

function formatNoteDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  return String(d.getMonth()+1) + '/' + String(d.getDate());
}

function renderNotesList() {
  const container = document.getElementById('notes-list');
  if(!container) return;
  
  if (notes.length === 0) {
    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 13px;">点击上方 + 创建新笔记</div>';
    return;
  }

  // 按照更新时间排序
  const sortedNotes = [...notes].sort((a,b) => b.updatedAt - a.updatedAt);

  container.innerHTML = sortedNotes.map(n => `
    <div class="note-item ${n.id === activeNoteId ? 'active' : ''}" onclick="selectNote('${n.id}')">
      <div class="note-item-title">${escapeHtml(n.title) || '无标题'}</div>
      <div class="note-item-meta">
        <span class="note-item-date">${formatNoteDate(n.updatedAt)}</span>
        <span class="note-item-snippet">${escapeHtml(getNoteSnippet(n.content))}</span>
      </div>
    </div>
  `).join('');
}

function renderNoteEditor() {
  const editor = document.getElementById('notes-editor');
  if(!editor) return;

  if(!activeNoteId) {
    editor.innerHTML = '<div class="note-empty-state">请选择或创建一篇笔记</div>';
    return;
  }

  const note = notes.find(n => n.id === activeNoteId);
  if(!note) return;

  // 使用 contenteditable 代替原有的 textarea 以支持富文本和图片
  editor.innerHTML = `
    <div class="notes-editor-toolbar">
      <div class="rt-tools">
        <button class="btn btn-ghost btn-sm btn-icon" onmousedown="event.preventDefault(); formatDoc('bold')" title="加粗" style="font-weight:900;">B</button>
        <select class="rt-select" onchange="formatDoc('fontSize', this.value); this.selectedIndex=0;">
          <option value="">A 字号</option>
          <option value="3">正常大小</option>
          <option value="4">中等标题</option>
          <option value="5">大标题</option>
        </select>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="document.getElementById('rt-img-upload').click()" title="插入图片">🖼️</button>
        <input type="file" id="rt-img-upload" accept="image/*" style="display:none" onchange="insertImage(event)">
      </div>
      <button class="btn btn-danger btn-sm" onclick="deleteNote('${note.id}')" title="删除笔记">删除</button>
    </div>
    <div class="notes-editor-content-wrap">
      <input type="text" id="note-title" class="note-title-input" value="${escapeHtml(note.title)}" placeholder="无标题" oninput="updateActiveNote()">
      
      <!-- 富文本编辑区 -->
      <div id="note-content" class="note-content-editor" contenteditable="true" placeholder="在这里输入笔记、粘贴内容，或者通过上方按钮插入图片..." oninput="updateActiveNote()">${note.content}</div>
    </div>
  `;
}

/* ============ ROOT NOTES ============ */

function addRootGroup(){
  const term = document.getElementById('root-term').value.trim();
  const meaning = document.getElementById('root-meaning').value.trim();
  const firstWord = document.getElementById('root-first-word').value.trim();
  const firstMeaning = document.getElementById('root-first-meaning').value.trim();

  if(!term){ document.getElementById('root-term').focus(); return; }

  const words = [];
  if(firstWord){
    words.push({ id: 'rw' + Date.now(), word: firstWord, meaning: firstMeaning, children: [] });
  }

  roots.unshift({
    id: 'r' + Date.now(),
    root: term,
    meaning: meaning,
    words: words,
    createdAt: Date.now(),
    reviewLevel: 0,
    nextReview: Date.now(),
    lastReviewed: 0
  });

  document.getElementById('root-term').value = '';
  document.getElementById('root-meaning').value = '';
  document.getElementById('root-first-word').value = '';
  document.getElementById('root-first-meaning').value = '';
  document.getElementById('root-term').focus();

  saveRoots();
  renderRoots();
}

function findWordNode(nodes, nodeId){
  for(const n of nodes){
    if(n.id === nodeId) return n;
    if(n.children && n.children.length){
      const found = findWordNode(n.children, nodeId);
      if(found) return found;
    }
  }
  return null;
}

function removeWordNode(nodes, nodeId){
  const idx = nodes.findIndex(n => n.id === nodeId);
  if(idx !== -1){ nodes.splice(idx, 1); return true; }
  for(const n of nodes){
    if(n.children && n.children.length && removeWordNode(n.children, nodeId)) return true;
  }
  return false;
}

function addWordToRoot(rootId){
  const wordInput = document.getElementById('add-word-' + rootId);
  const meaningInput = document.getElementById('add-word-meaning-' + rootId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }

  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  r.words.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();

  requestAnimationFrame(() => {
    const again = document.getElementById('add-word-' + rootId);
    if(again) again.focus();
  });
}

function toggleChildForm(nodeId){
  const form = document.getElementById('child-form-' + nodeId);
  if(!form) return;
  const isOpen = form.classList.toggle('open');
  if(isOpen){
    const input = document.getElementById('child-word-' + nodeId);
    if(input) input.focus();
  }
}

function addChildWord(rootId, parentNodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const parent = findWordNode(r.words, parentNodeId);
  if(!parent) return;

  const wordInput = document.getElementById('child-word-' + parentNodeId);
  const meaningInput = document.getElementById('child-meaning-' + parentNodeId);
  const word = wordInput.value.trim();
  const meaning = meaningInput.value.trim();
  if(!word){ wordInput.focus(); return; }

  if(!Array.isArray(parent.children)) parent.children = [];
  parent.children.push({ id: 'rw' + Date.now(), word, meaning, children: [] });
  saveRoots();
  renderRoots();
}

function startEditWordNode(nodeId){
  editingRootNodeId = nodeId;
  renderRoots();
}

function cancelEditWordNode(){
  editingRootNodeId = null;
  renderRoots();
}

function saveEditWordNode(rootId, nodeId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const node = findWordNode(r.words, nodeId);
  if(!node) return;
  
  const newWord = document.getElementById('edit-node-word-' + nodeId).value.trim();
  const newMeaning = document.getElementById('edit-node-meaning-' + nodeId).value.trim();
  
  if(!newWord){ document.getElementById('edit-node-word-' + nodeId).focus(); return; }
  
  node.word = newWord;
  node.meaning = newMeaning;
  
  editingRootNodeId = null;
  saveRoots();
  renderRoots();
}

function deleteWordNode(rootId, nodeId){
  if(!confirm('确定要删除这个词吗？这也会删除它的所有下级派生词。')) return;
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  removeWordNode(r.words, nodeId);
  saveRoots();
  renderRoots();
}

function deleteRoot(rootId){
  if(!confirm('确定要删除这个词根笔记吗？这会一并删除它下面的所有派生词。')) return;
  roots = roots.filter(r => r.id !== rootId);
  saveRoots();
  renderRoots();
}

function editRootMeta(rootId){
  const r = roots.find(x => x.id === rootId);
  if(!r) return;
  const newRoot = prompt('词根：', r.root);
  if(newRoot === null) return;
  const newMeaning = prompt('词根含义：', r.meaning || '');
  if(newMeaning === null) return;
  r.root = newRoot.trim() || r.root;
  r.meaning = newMeaning.trim();
  saveRoots();
  renderRoots();
}

function nodeMatchesSearch(nodes, search){
  return nodes.some(n =>
    n.word.toLowerCase().includes(search) ||
    (n.meaning && n.meaning.toLowerCase().includes(search)) ||
    (n.children && n.children.length && nodeMatchesSearch(n.children, search))
  );
}

function renderRoots(){
  const container = document.getElementById('roots-list');
  if(!container) return;

  const searchEl = document.getElementById('search-roots');
  const sortEl = document.getElementById('sort-roots');
  const search = (searchEl ? searchEl.value : '').trim().toLowerCase();
  const sort = sortEl ? sortEl.value : 'new';

  let list = roots.slice();

  if(search){
    list = list.filter(r =>
      r.root.toLowerCase().includes(search) ||
      (r.meaning && r.meaning.toLowerCase().includes(search)) ||
      nodeMatchesSearch(r.words, search)
    );
  }

  list.sort((a,b) => sort === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  if(list.length === 0){
    container.innerHTML = `<div class="empty-msg">${roots.length === 0 ? '还没有词根笔记 — 在上方创建第一个吧（比如 spect = 看，见）' : '没有找到匹配的词根笔记'}</div>`;
    return;
  }

  container.innerHTML = list.map(renderRootCard).join('');
}

function renderWordTree(nodes, rootId, depth){
  if(!nodes || nodes.length === 0) return '';
  return `
    <div class="root-stem-down"></div>
    <div class="root-branches-wrap">
      <div class="root-branches">
        ${nodes.map(n => renderWordBranch(n, rootId, depth)).join('')}
      </div>
    </div>
  `;
}

function renderWordBranch(node, rootId, depth){
  const children = Array.isArray(node.children) ? node.children : [];
  
  if (node.id === editingRootNodeId) {
    return `
      <div class="root-word-branch" data-depth="${depth}">
        <div class="root-word-node" style="padding: 12px 10px;">
          <input type="text" id="edit-node-word-${node.id}" value="${escapeHtml(node.word)}" style="width: 100%; margin-bottom: 6px; font-size: 13px; padding: 5px 8px; text-align: center;">
          <input type="text" id="edit-node-meaning-${node.id}" value="${escapeHtml(node.meaning || '')}" placeholder="意思" style="width: 100%; margin-bottom: 10px; font-size: 12px; padding: 5px 8px; text-align: center;">
          <div style="display: flex; gap: 6px; justify-content: center;">
            <button class="btn btn-success" style="padding: 4px 10px; font-size: 11px;" onclick="saveEditWordNode('${rootId}', '${node.id}')">保存</button>
            <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 11px;" onclick="cancelEditWordNode()">取消</button>
          </div>
        </div>
        ${renderWordTree(children, rootId, depth + 1)}
      </div>
    `;
  }

  return `
    <div class="root-word-branch" data-depth="${depth}">
      <div class="root-word-node">
        <div class="root-word-actions">
          <button class="root-word-action-btn" onclick="startEditWordNode('${node.id}')" title="编辑单词">✎</button>
          <button class="root-word-action-btn" onclick="deleteWordNode('${rootId}','${node.id}')" title="删除（含所有子节点）">×</button>
        </div>
        <div class="root-word-row">
          <span class="root-word-text">${escapeHtml(node.word)}</span>
          <button class="speak-btn" style="width:20px;height:20px;font-size:11px;" onclick="speakText(this.closest('.root-word-node').querySelector('.root-word-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
        </div>
        ${node.meaning ? `<div class="root-word-meaning">${escapeHtml(node.meaning)}</div>` : ''}
        <button class="root-word-add-child" onclick="toggleChildForm('${node.id}')" title="给这个词再加一个派生词">+ 派生词</button>
      </div>
      <div class="child-add-form" id="child-form-${node.id}">
        <input type="text" id="child-word-${node.id}" placeholder="派生词" onkeydown="if(event.key==='Enter'){document.getElementById('child-meaning-${node.id}').focus();}">
        <input type="text" id="child-meaning-${node.id}" placeholder="意思" onkeydown="if(event.key==='Enter'){addChildWord('${rootId}','${node.id}');}">
        <button class="btn btn-sm" onclick="addChildWord('${rootId}','${node.id}')">添加</button>
      </div>
      ${renderWordTree(children, rootId, depth + 1)}
    </div>
  `;
}

function renderRootCard(r){
  return `
  <div class="root-card">
    <div class="root-card-actions">
      <button class="btn btn-ghost btn-sm" onclick="editRootMeta('${r.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRoot('${r.id}')">删除</button>
    </div>
    <div class="root-node-wrap">
      <div class="root-node">
        <span class="root-node-text">${escapeHtml(r.root)}</span>
        ${r.meaning ? `<span class="root-node-meaning">${escapeHtml(r.meaning)}</span>` : ''}
        <button class="speak-btn" onclick="speakText(this.closest('.root-node').querySelector('.root-node-text').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
      </div>
    </div>
    ${r.words.length ? renderWordTree(r.words, r.id, 1) : `<div class="root-empty-hint">还没有派生词，在下方添加第一个吧</div>`}
    <div class="root-add-word-row">
      <input type="text" id="add-word-${r.id}" placeholder="派生词，e.g. respect" onkeydown="if(event.key==='Enter'){document.getElementById('add-word-meaning-${r.id}').focus();}">
      <input type="text" id="add-word-meaning-${r.id}" placeholder="意思" onkeydown="if(event.key==='Enter'){addWordToRoot('${r.id}');}">
      <button class="btn btn-sm" onclick="addWordToRoot('${r.id}')">+ 添加</button>
    </div>
  </div>
  `;
}

/* ============ ADD / EDIT / DELETE (Entries) ============ */

function addEntry(mode){
  let term, type, tag, translation, note;

  if (mode === 'word') {
    term = document.getElementById('word-term').value.trim();
    type = document.getElementById('word-type').value;
    tag = document.getElementById('word-tag').value.trim();
    translation = document.getElementById('word-translation').value.trim();
    note = document.getElementById('word-note').value.trim();
    
    if(!term){ document.getElementById('word-term').focus(); return; }
  } else if (mode === 'sentence') {
    term = document.getElementById('sentence-term').value.trim();
    type = 'sentence';
    tag = document.getElementById('sentence-tag').value.trim();
    translation = document.getElementById('sentence-translation').value.trim();
    note = document.getElementById('sentence-note').value.trim();

    if(!term){ document.getElementById('sentence-term').focus(); return; }
  }

  entries.unshift({
    id: 'e' + Date.now(),
    term, type, tag, translation, note,
    createdAt: Date.now(),
    reviewLevel: 0,
    nextReview: Date.now(),
    lastReviewed: 0
  });

  if (mode === 'word') {
    document.getElementById('word-term').value = '';
    document.getElementById('word-tag').value = '';
    document.getElementById('word-translation').value = '';
    document.getElementById('word-note').value = '';
    document.getElementById('word-term').focus();
  } else {
    document.getElementById('sentence-term').value = '';
    document.getElementById('sentence-tag').value = '';
    document.getElementById('sentence-translation').value = '';
    document.getElementById('sentence-note').value = '';
    document.getElementById('sentence-term').focus();
  }

  saveEntries();
  render();
}

function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function startEdit(id){
  editingId = id;
  render();
}

function cancelEdit(){
  editingId = null;
  render();
}

function saveEdit(id){
  const entry = entries.find(e => e.id === id);
  if (entry.type === 'sentence') {
    entry.term = document.getElementById('edit-sen-term-'+id).value.trim();
    entry.tag = document.getElementById('edit-sen-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-sen-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-sen-note-'+id).value.trim();
  } else {
    entry.term = document.getElementById('edit-word-term-'+id).value.trim();
    entry.type = document.getElementById('edit-word-type-'+id).value;
    entry.tag = document.getElementById('edit-word-tag-'+id).value.trim();
    entry.translation = document.getElementById('edit-word-translation-'+id).value.trim();
    entry.note = document.getElementById('edit-word-note-'+id).value.trim();
  }
  editingId = null;
  saveEntries();
  render();
}

/* ============ TEXT TO SPEECH ============ */

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function speak(text, lang = 'en-US'){
  if(!('speechSynthesis' in window)){
    alert('你的浏览器不支持语音朗读功能');
    return;
  }
  if(!text) return;
  
  speechSynthesis.cancel(); 
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 0.9; 

  const voices = speechSynthesis.getVoices();
  
  if (voices.length > 0) {
    let bestVoice = 
      voices.find(v => v.lang.startsWith('en') && v.name.includes('Natural')) ||
      voices.find(v => v.lang === 'en-US' && v.name.includes('Google US English')) ||
      voices.find(v => v.name === 'Samantha' || v.name === 'Alex' || v.name === 'Daniel') ||
      voices.find(v => v.lang === 'en-US');

    if (bestVoice) {
      utter.voice = bestVoice;
    }
  }

  speechSynthesis.speak(utter);
}

function speakEntry(id, btn){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  flashSpeakBtn(btn);
  speak(e.term, 'en-US');
}

function speakText(text, btn){
  flashSpeakBtn(btn);
  speak(text, 'en-US');
}

function flashSpeakBtn(btn){
  if(!btn) return;
  btn.classList.add('speaking');
  setTimeout(() => btn.classList.remove('speaking'), 400);
}

/* ============ HELPERS ============ */

function typeLabel(type){
  if(type === 'word') return '单词';
  if(type === 'phrase') return '短语';
  if(type === 'sentence') return '句子';
  return type;
}

function formatDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============ RENDER LOGIC ============ */

function updateFilters(){
  const wordsTagSelect = document.getElementById('filter-tag-words');
  const senTagSelect = document.getElementById('filter-tag-sentences');
  
  const wordTags = [...new Set(entries.filter(e => e.type !== 'sentence').map(e => e.tag).filter(Boolean))].sort();
  const senTags = [...new Set(entries.filter(e => e.type === 'sentence').map(e => e.tag).filter(Boolean))].sort();

  const currentWT = wordsTagSelect.value;
  wordsTagSelect.innerHTML = '<option value="">全部标签</option>' + wordTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(wordTags.includes(currentWT)) wordsTagSelect.value = currentWT;

  const currentST = senTagSelect.value;
  senTagSelect.innerHTML = '<option value="">全部标签</option>' + senTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  if(senTags.includes(currentST)) senTagSelect.value = currentST;
}

function render(){
  updateFilters();
  updateDueBadge();
  document.getElementById('entry-count').textContent = `总共 ${entries.length} 项记录`;

  const searchW = document.getElementById('search-words').value.trim().toLowerCase();
  const typeFilterW = document.getElementById('filter-type-words').value;
  const tagFilterW = document.getElementById('filter-tag-words').value;
  const sortW = document.getElementById('sort-words').value;

  let wordsList = entries.filter(e => e.type !== 'sentence');
  wordsList = wordsList.filter(e => {
    if(typeFilterW && e.type !== typeFilterW) return false;
    if(tagFilterW && e.tag !== tagFilterW) return false;
    if(searchW && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchW)) return false;
    return true;
  });
  wordsList.sort((a,b) => sortW === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);
  
  const wordsContainer = document.getElementById('words-entries');
  if(entries.filter(e => e.type !== 'sentence').length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">还没有单词记录 — 在上方添加你的第一个单词或短语吧</div>';
  } else if(wordsList.length === 0){
    wordsContainer.innerHTML = '<div class="empty-msg">没有符合条件的单词记录</div>';
  } else {
    wordsContainer.innerHTML = wordsList.map(generateEntryHTML).join('');
  }

  const searchS = document.getElementById('search-sentences').value.trim().toLowerCase();
  const tagFilterS = document.getElementById('filter-tag-sentences').value;
  const sortS = document.getElementById('sort-sentences').value;

  let senList = entries.filter(e => e.type === 'sentence');
  senList = senList.filter(e => {
    if(tagFilterS && e.tag !== tagFilterS) return false;
    if(searchS && ![e.term, e.translation, e.note, e.tag].join(' ').toLowerCase().includes(searchS)) return false;
    return true;
  });
  senList.sort((a,b) => sortS === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  const senContainer = document.getElementById('sentences-entries');
  if(entries.filter(e => e.type === 'sentence').length === 0){
    senContainer.innerHTML = '<div class="empty-msg">还没有长句记录 — 在上方记录你在阅读中遇到的好句子吧</div>';
  } else if(senList.length === 0){
    senContainer.innerHTML = '<div class="empty-msg">没有符合条件的长句记录</div>';
  } else {
    senContainer.innerHTML = senList.map(generateEntryHTML).join('');
  }
}

/* ============ REVIEW (Flashcards) ============ */

let reviewQueue = [];
let reviewIndex = 0;
let reviewRevealed = false;
let reviewStats = {known:0, vague:0, forgot:0};

function reviewableEntries(mode = 'all'){
  return entries.filter(e => {
    if(!(e.translation || e.note)) return false;
    if(mode === 'words' && e.type === 'sentence') return false;
    if(mode === 'sentences' && e.type !== 'sentence') return false;
    return true;
  });
}

function dueEntries(mode = 'all'){
  const now = Date.now();
  return reviewableEntries(mode).filter(e => e.nextReview <= now);
}

let rootReviewQueue = [];
let rootReviewIndex = 0;
let rootReviewRevealed = false;
let rootReviewStats = {known:0, vague:0, forgot:0};

function flattenRootWords(nodes, depth = 1, acc = []){
  (nodes || []).forEach(n => {
    acc.push({ word: n.word, meaning: n.meaning, depth });
    if(n.children && n.children.length) flattenRootWords(n.children, depth + 1, acc);
  });
  return acc;
}

function reviewableRoots(){
  return roots.filter(r => r.words && r.words.length > 0);
}

function dueRoots(){
  const now = Date.now();
  return reviewableRoots().filter(r => (r.nextReview || 0) <= now);
}

function startRootReview(all){
  rootReviewQueue = shuffle(all ? reviewableRoots() : dueRoots());
  rootReviewIndex = 0;
  rootReviewRevealed = false;
  rootReviewStats = {known:0, vague:0, forgot:0};
  renderReview();
}
function revealRootCard(){ rootReviewRevealed = true; renderReview(); }
function rateRootCard(rating){
  const r = rootReviewQueue[rootReviewIndex];
  const now = Date.now();
  r.lastReviewed = now;
  if(typeof r.reviewLevel !== 'number') r.reviewLevel = 0;
  if(rating === 'known'){ r.reviewLevel = Math.min(r.reviewLevel + 1, LEVEL_INTERVALS.length - 1); rootReviewStats.known++; }
  else if(rating === 'vague'){ r.reviewLevel = Math.max(r.reviewLevel - 1, 0); rootReviewStats.vague++; }
  else{ r.reviewLevel = 0; rootReviewStats.forgot++; }
  r.nextReview = now + LEVEL_INTERVALS[r.reviewLevel] * DAY;
  saveRoots();
  rootReviewIndex++;
  rootReviewRevealed = false;
  renderReview();
  updateDueBadge();
}
function resetRootReview(){ rootReviewQueue = []; rootReviewIndex = 0; rootReviewRevealed = false; renderReview(); }

function renderRootReviewSession(content){
  if(rootReviewIndex >= rootReviewQueue.length){
    content.innerHTML = `
      <div style="max-width: 880px; margin: 0 auto;">
        <div class="quiz-score">复习完成！</div>
        <div class="center" style="font-family:inherit;font-size:13px;color:var(--ink-soft);">
          记得 ${rootReviewStats.known} · 模糊 ${rootReviewStats.vague} · 忘记 ${rootReviewStats.forgot}
        </div>
        <div class="btn-row" style="justify-content:center;margin-top:18px;">
          <button class="btn" onclick="resetRootReview()">返回列表</button>
        </div>
      </div>
    `;
    return;
  }

  const r = rootReviewQueue[rootReviewIndex];
  const flat = flattenRootWords(r.words);
  content.innerHTML = `
    <div style="max-width: 880px; margin: 0 auto;">
      <div class="progress-row">
        <span>第 ${rootReviewIndex + 1} / ${rootReviewQueue.length} 个词根</span>
        <span>Lv.${r.reviewLevel || 0}</span>
      </div>
      <div class="flashcard">
        <div class="fc-meta"><span class="type-badge">词根 ROOT</span></div>
        <div class="fc-term-row">
          <div class="fc-term">${escapeHtml(r.root)}</div>
          <button class="speak-btn" onclick="speakText(this.closest('.fc-term-row').querySelector('.fc-term').textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
        </div>
        ${r.meaning ? `<div class="fc-translation">${escapeHtml(r.meaning)}</div>` : ''}
        ${!rootReviewRevealed ? `
          <div class="root-review-hint">回忆一下：这个词根下有哪些派生词？想好了再点击下方按钮核对</div>
        ` : `
          <div class="fc-back">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;font-weight:700;">派生词 · ${flat.length} 个</div>
            <div class="root-review-word-list">
              ${flat.map(w => `<div class="root-review-word-item" style="margin-left:${(w.depth-1)*16}px"><span class="rrwi-word">${escapeHtml(w.word)}</span>${w.meaning ? `<span class="rrwi-meaning"> — ${escapeHtml(w.meaning)}</span>` : ''}</div>`).join('')}
            </div>
          </div>
        `}
      </div>
      ${!rootReviewRevealed ? `
        <div class="center"><button class="btn" onclick="revealRootCard()">显示派生词</button></div>
      ` : `
        <div class="rate-row">
          <button class="btn btn-danger" onclick="rateRootCard('forgot')">忘记了</button>
          <button class="btn btn-warn" onclick="rateRootCard('vague')">模糊</button>
          <button class="btn btn-success" onclick="rateRootCard('known')">记得</button>
        </div>
      `}
    </div>
  `;
}

function renderReview(){
  const content = document.getElementById('review-content');

  if(rootReviewQueue.length > 0){
    renderRootReviewSession(content);
    return;
  }

  if(reviewQueue.length === 0){
    const dueWords = dueEntries('words').length;
    const allWords = reviewableEntries('words').length;
    const dueSens = dueEntries('sentences').length;
    const allSens = reviewableEntries('sentences').length;
    const dueRootsCount = dueRoots().length;
    const allRootsCount = reviewableRoots().length;

    if(allWords === 0 && allSens === 0 && allRootsCount === 0){
      content.innerHTML = '<div class="empty-msg">还没有可复习的内容 — 先去添加一些带翻译或笔记的词汇/长句/词根吧</div>';
      return;
    }

    content.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:16px; max-width: 880px; margin: 0 auto;">
        <div style="border:1px solid var(--grid); border-left:4px solid var(--success); border-radius:var(--r-md); padding:18px 20px; background:var(--card); box-shadow:var(--shadow-sm);">
          <div style="font-family:inherit; font-size:16px; font-weight:700; margin-bottom:8px;">📝 单词与短语</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">今日待复习：<b>${dueWords}</b> 项（总库共 ${allWords} 项）</div>
          <div class="btn-row">
            <button class="btn" onclick="startReview('words', false)" ${dueWords===0?'disabled':''}>开始今日复习</button>
            <button class="btn btn-ghost" onclick="startReview('words', true)" ${allWords===0?'disabled':''}>复习全部</button>
          </div>
        </div>

        <div style="border:1px solid var(--grid); border-left:4px solid var(--accent-blue); border-radius:var(--r-md); padding:18px 20px; background:var(--card); box-shadow:var(--shadow-sm);">
          <div style="font-family:inherit; font-size:16px; font-weight:700; margin-bottom:8px;">📖 长句</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">今日待复习：<b>${dueSens}</b> 项（总库共 ${allSens} 项）</div>
          <div class="btn-row">
            <button class="btn" onclick="startReview('sentences', false)" ${dueSens===0?'disabled':''}>开始今日复习</button>
            <button class="btn btn-ghost" onclick="startReview('sentences', true)" ${allSens===0?'disabled':''}>复习全部</button>
          </div>
        </div>

        <div style="border:1px solid var(--grid); border-left:4px solid var(--accent-purple); border-radius:var(--r-md); padding:18px 20px; background:var(--card); box-shadow:var(--shadow-sm);">
          <div style="font-family:inherit; font-size:16px; font-weight:700; margin-bottom:8px;">🌳 词根词族</div>
          <div style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">今日待复习：<b>${dueRootsCount}</b> 个词根（总库共 ${allRootsCount} 个词根）</div>
          <div class="btn-row">
            <button class="btn" onclick="startRootReview(false)" ${dueRootsCount===0?'disabled':''}>开始今日复习</button>
            <button class="btn btn-ghost" onclick="startRootReview(true)" ${allRootsCount===0?'disabled':''}>复习全部</button>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if(reviewIndex >= reviewQueue.length){
    content.innerHTML = `
      <div style="max-width: 880px; margin: 0 auto;">
        <div class="quiz-score">复习完成！</div>
        <div class="center" style="font-family:'Open Sans',sans-serif;font-size:13px;color:var(--ink-soft);">
          记得 ${reviewStats.known} · 模糊 ${reviewStats.vague} · 忘记 ${reviewStats.forgot}
        </div>
        <div class="btn-row" style="justify-content:center;margin-top:18px;">
          <button class="btn" onclick="resetReview()">返回列表</button>
        </div>
      </div>
    `;
    return;
  }

  const e = reviewQueue[reviewIndex];
  content.innerHTML = `
    <div style="max-width: 880px; margin: 0 auto;">
      <div class="progress-row">
        <span>第 ${reviewIndex + 1} / ${reviewQueue.length} 项</span>
        <span>Lv.${e.reviewLevel}</span>
      </div>
      <div class="flashcard">
        <div class="fc-meta">
          <span class="type-badge">${typeLabel(e.type)}</span>
          ${e.tag ? `<span class="tag-badge">${escapeHtml(e.tag)}</span>` : ''}
        </div>
        <div class="fc-term-row">
          <div class="fc-term">${escapeHtml(e.term)}</div>
          <button class="speak-btn" onclick="speakEntry('${e.id}', this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>
        </div>
        ${reviewRevealed ? `
          <div class="fc-back">
            ${e.translation ? `<div class="fc-translation">${escapeHtml(e.translation)}</div>` : ''}
            ${e.note ? `<div class="fc-note">${escapeHtml(e.note)}</div>` : ''}
          </div>
        ` : ''}
      </div>
      ${!reviewRevealed ? `
        <div class="center"><button class="btn" onclick="revealCard()">显示答案</button></div>
      ` : `
        <div class="rate-row">
          <button class="btn btn-danger" onclick="rateCard('forgot')">忘记了</button>
          <button class="btn btn-warn" onclick="rateCard('vague')">模糊</button>
          <button class="btn btn-success" onclick="rateCard('known')">记得</button>
        </div>
      `}
    </div>
  `;
}

function startReview(mode, all){
  reviewQueue = shuffle(all ? reviewableEntries(mode) : dueEntries(mode));
  reviewIndex = 0;
  reviewRevealed = false;
  reviewStats = {known:0, vague:0, forgot:0};
  renderReview();
}
function revealCard(){ reviewRevealed = true; renderReview(); }
function rateCard(rating){
  const e = reviewQueue[reviewIndex];
  const now = Date.now();
  e.lastReviewed = now;
  if(rating === 'known'){ e.reviewLevel = Math.min(e.reviewLevel + 1, LEVEL_INTERVALS.length - 1); reviewStats.known++; }
  else if(rating === 'vague'){ e.reviewLevel = Math.max(e.reviewLevel - 1, 0); reviewStats.vague++; }
  else{ e.reviewLevel = 0; reviewStats.forgot++; }
  e.nextReview = now + LEVEL_INTERVALS[e.reviewLevel] * DAY;
  saveEntries();
  reviewIndex++;
  reviewRevealed = false;
  renderReview();
  render();
}
function resetReview(){ reviewQueue = []; reviewIndex = 0; reviewRevealed = false; renderReview(); }

/* ============ QUIZ ============ */

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function quizEligibleEntries(mode = 'all'){
  return entries.filter(e => {
    if(!(e.translation && e.translation.trim())) return false;
    if(mode === 'words' && e.type === 'sentence') return false;
    if(mode === 'sentences' && e.type !== 'sentence') return false;
    return true;
  });
}

function getQuizOptionsHTML(length) {
  const maxQ = Math.min(length, 20);
  const options = [5,10,20].filter(n => n <= maxQ);
  if(options.length === 0 || options[options.length-1] !== maxQ) options.push(maxQ);
  return options.map(n => `<option value="${n}">${n} 题</option>`).join('');
}

function renderQuizSetup(){
  const content = document.getElementById('quiz-content');
  if(quizQuestions.length > 0 && quizIndex < quizQuestions.length){ renderQuizQuestion(); return; }
  if(quizQuestions.length > 0 && quizIndex >= quizQuestions.length){ renderQuizResult(); return; }

  const eligibleWords = quizEligibleEntries('words');
  const eligibleSens = quizEligibleEntries('sentences');

  if(eligibleWords.length < 2 && eligibleSens.length < 2){
    content.innerHTML = '<div class="empty-msg">每种类型至少需要2条带「中文翻译」的记录才能开始测验，先去补充翻译吧</div>';
    return;
  }

  content.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:16px; max-width: 880px; margin: 0 auto;">
      <div style="border:1px solid var(--grid); border-left:4px solid var(--success); border-radius:var(--r-md); padding:16px; background:var(--card); opacity:${eligibleWords.length < 2 ? '0.5' : '1'}; box-shadow:var(--shadow-sm);">
        <div style="font-family:inherit; font-size:16px; font-weight:700; margin-bottom:8px;">📝 单词与短语测验</div>
        <div class="session-setup">
          <span style="font-size:13px; color:var(--ink-soft); margin-right:10px;">可用题目：${eligibleWords.length}</span>
          ${eligibleWords.length >= 2 ? `
            <select id="quiz-count-words">${getQuizOptionsHTML(eligibleWords.length)}</select>
            <select id="quiz-direction-words">
              <option value="en2cn">看英文 → 选中文</option>
              <option value="cn2en">看中文 → 选英文</option>
            </select>
          ` : '<span style="font-size:12px;color:var(--accent);">需至少 2 个带翻译的记录</span>'}
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn" onclick="startQuiz('words')" ${eligibleWords.length < 2 ? 'disabled' : ''}>开始测验</button>
        </div>
      </div>

      <div style="border:1px solid var(--grid); border-left:4px solid var(--accent-blue); border-radius:var(--r-md); padding:16px; background:var(--card); opacity:${eligibleSens.length < 2 ? '0.5' : '1'}; box-shadow:var(--shadow-sm);">
        <div style="font-family:inherit; font-size:16px; font-weight:700; margin-bottom:8px;">📖 长句测验</div>
        <div class="session-setup">
          <span style="font-size:13px; color:var(--ink-soft); margin-right:10px;">可用题目：${eligibleSens.length}</span>
          ${eligibleSens.length >= 2 ? `
            <select id="quiz-count-sentences">${getQuizOptionsHTML(eligibleSens.length)}</select>
            <select id="quiz-direction-sentences">
              <option value="en2cn">看英文 → 选中文</option>
              <option value="cn2en">看中文 → 选英文</option>
            </select>
          ` : '<span style="font-size:12px;color:var(--accent);">需至少 2 个带翻译的记录</span>'}
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn" onclick="startQuiz('sentences')" ${eligibleSens.length < 2 ? 'disabled' : ''}>开始测验</button>
        </div>
      </div>
    </div>
  `;
}

function startQuiz(mode){
  const count = parseInt(document.getElementById(`quiz-count-${mode}`).value, 10);
  const direction = document.getElementById(`quiz-direction-${mode}`).value;
  const eligible = quizEligibleEntries(mode);
  const chosen = shuffle(eligible).slice(0, count);
  quizQuestions = chosen.map(e => {
    const correct = direction === 'en2cn' ? e.translation : e.term;
    const pool = eligible.filter(o => o.id !== e.id);
    const distractors = shuffle(pool).slice(0, 3).map(o => direction === 'en2cn' ? o.translation : o.term);
    return { prompt: direction === 'en2cn' ? e.term : e.translation, correct, options: shuffle([correct, ...distractors]), direction };
  });
  quizIndex = 0; quizScore = 0; quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const content = document.getElementById('quiz-content');
  const q = quizQuestions[quizIndex];
  content.innerHTML = `
    <div style="max-width: 880px; margin: 0 auto;">
      <div class="quiz-progress">第 ${quizIndex + 1} / ${quizQuestions.length} 题 · 得分 ${quizScore}</div>
      <div class="quiz-question-row">
        <div class="quiz-question">${escapeHtml(q.prompt)}</div>
        ${q.direction === 'en2cn' ? `<button class="speak-btn" onclick="speakText(this.previousElementSibling.textContent, this)" title="朗读发音"><img src="sound.png" alt="朗读" class="speak-icon"></button>` : ''}
      </div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `<button class="quiz-option" id="quiz-opt-${i}" onclick="answerQuiz(${i})">${escapeHtml(opt)}</button>`).join('')}
      </div>
    </div>
  `;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  if(q.options[i] === q.correct) quizScore++;
  q.options.forEach((opt, idx) => {
    const btn = document.getElementById('quiz-opt-' + idx);
    btn.disabled = true;
    if(opt === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('incorrect');
  });
  document.getElementById('quiz-content').querySelector('div').innerHTML += `<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn" onclick="nextQuiz()">${quizIndex + 1 < quizQuestions.length ? '下一题' : '查看结果'}</button></div>`;
}

function nextQuiz(){
  quizIndex++; quizAnswered = false;
  if(quizIndex >= quizQuestions.length) renderQuizResult();
  else renderQuizQuestion();
}

function renderQuizResult(){
  document.getElementById('quiz-content').innerHTML = `
    <div style="max-width: 880px; margin: 0 auto;">
      <div class="quiz-score">${quizScore} / ${quizQuestions.length}</div>
      <div class="center" style="font-family:inherit;font-size:13px;color:var(--ink-soft);">正确率 ${Math.round(quizScore/quizQuestions.length*100)}%</div>
      <div class="btn-row" style="justify-content:center;margin-top:18px;"><button class="btn" onclick="restartQuiz()">再来一次</button></div>
    </div>
  `;
}

function restartQuiz(){ quizQuestions = []; quizIndex = 0; quizScore = 0; quizAnswered = false; renderQuizSetup(); }

/* ============ EXPORT / IMPORT ============ */

function exportData(){
  const payload = { entries: entries, roots: roots, notes: notes, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = `vocab-notebook-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);

      const importedEntries = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.entries) ? parsed.entries : null);
      const importedRoots = Array.isArray(parsed) ? [] : (Array.isArray(parsed.roots) ? parsed.roots : []);
      const importedNotes = Array.isArray(parsed) ? [] : (Array.isArray(parsed.notes) ? parsed.notes : []);

      if(!importedEntries) throw new Error('Invalid format');

      if(confirm(`导入记录：单词/长句(${importedEntries.length}), 词根(${importedRoots.length}), 笔记(${importedNotes.length})\n\n点"确定"合并到现有数据，点"取消"覆盖现有数据。`)){
        const existingIds = new Set(entries.map(en => en.id));
        importedEntries.forEach(im => { if(!existingIds.has(im.id)) entries.unshift(im); });

        const existingRootIds = new Set(roots.map(r => r.id));
        importedRoots.forEach(im => { if(!existingRootIds.has(im.id)) roots.unshift(im); });
        
        const existingNoteIds = new Set(notes.map(n => n.id));
        importedNotes.forEach(im => { if(!existingNoteIds.has(im.id)) notes.unshift(im); });
      }else{
        entries = importedEntries;
        roots = importedRoots;
        notes = importedNotes;
      }
      
      entries.forEach(e => {
        if(typeof e.reviewLevel !== 'number') e.reviewLevel = 0;
        if(typeof e.nextReview !== 'number') e.nextReview = Date.now();
        if(typeof e.lastReviewed !== 'number') e.lastReviewed = 0;
      });
      roots.forEach(r => {
        if(!Array.isArray(r.words)) r.words = [];
        if(typeof r.createdAt !== 'number') r.createdAt = Date.now();
      });
      normalizeRoots(roots);
      
      if(notes.length > 0 && !notes.find(n => n.id === activeNoteId)) {
        activeNoteId = notes[0].id;
      }

      saveEntries(); saveRoots(); saveNotes();
      render(); renderReview(); renderRoots(); renderNotesList(); renderNoteEditor();
    }catch(err){ alert('导入失败：文件格式不正确'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ============ INIT ============ */

document.getElementById('word-term').addEventListener('keydown', function(e){
  if(e.key === 'Enter') { addEntry('word'); }
});

document.getElementById('sentence-term').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { addEntry('sentence'); }
});

document.getElementById('root-term').addEventListener('keydown', function(e){
  if(e.key === 'Enter') { document.getElementById('root-meaning').focus(); }
});

loadEntries();
loadRoots();
loadNotes();
</script>
